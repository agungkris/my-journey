<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Journey</title>
<meta name="description" content="Anggaran, KPR, target hidup, dan jadwal mingguan" />
<meta name="theme-color" content="#173229" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="My Journey" />
<link rel="manifest" id="manifest-placeholder" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EE; --card:#FFFFFF; --ink:#173229; --ink-soft:rgba(23,50,41,0.58);
    --accent:#B8892B; --accent-soft:#F3E7C7; --sage:#DEE6DD; --sage-line:#CBD8CA;
    --warn:#A85338; --warn-soft:#F3DED5; --good:#3E7A5B; --good-soft:#DCEBE1;
    --line:#E6E2D6; --radius:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  .num{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Fraunces',serif;}

  #header{background:var(--ink);padding:calc(env(safe-area-inset-top) + 22px) 20px 18px;color:#F6F4EE;position:relative;overflow:hidden;}
  #header::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(184,137,43,0.20) 0%,transparent 70%);}
  #header .inner{max-width:1040px;margin:0 auto;position:relative;}
  #header .eyebrow{font-size:11px;opacity:0.6;letter-spacing:1.5px;text-transform:uppercase;}
  #header h1{font-size:25px;font-weight:600;margin-top:3px;letter-spacing:-0.2px;}
  #header .sub{font-size:12.5px;opacity:0.55;margin-top:4px;}

  #tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  #tabs .inner{display:flex;overflow-x:auto;max-width:1040px;margin:0 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #tabs .inner::-webkit-scrollbar{display:none;}
  .tab-btn{flex:0 0 auto;padding:13px 16px;border:none;background:none;font-weight:600;font-size:12.5px;cursor:pointer;color:#9a9788;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);}

  #content{padding:16px 16px 100px;max-width:560px;margin:0 auto;}
  #content.wide{max-width:1040px;}

  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--line);}
  .card h3{font-size:14px;font-weight:600;margin-bottom:10px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .name{font-size:13.5px;flex:1;}
  .row .val{font-size:13.5px;font-weight:600;}
  .muted{color:var(--ink-soft);}
  .small{font-size:11.5px;}
  .section-gap{margin-top:14px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--sage);border-radius:12px;padding:12px 14px;}
  .stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);}
  .stat .amount{font-size:17px;font-weight:700;margin-top:3px;}
  .stat.warn{background:var(--warn-soft);}
  .stat.good{background:var(--good-soft);}

  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:16px;background:#fcfbf8;}
  /* 16px adalah batas aman: di bawah ini iOS Safari memperbesar tampilan
     otomatis saat kolom disentuh, dan pembesarannya tidak selalu kembali sendiri. */
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:4px;display:block;}
  .field{margin-bottom:10px;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}

  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-accent{background:var(--ink);color:#fff;}
  .btn-ghost{background:var(--sage);color:var(--ink);}
  .btn-warn{background:var(--warn-soft);color:var(--warn);}
  .btn-danger{background:var(--warn);color:#fff;}
  .konf-pesan{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:18px;}
  .sync-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);
    background:var(--ink);color:#fff;padding:6px 14px;border-radius:20px;font-size:11.5px;font-weight:600;z-index:120;
    box-shadow:0 4px 14px rgba(23,50,41,0.25);}
  .sync-pill.aman{background:var(--good);}
  .sync-pill.galat{background:var(--warn);}
  .petunjuk{border-top:1px solid var(--line);padding-top:10px;}
  .petunjuk summary{font-size:12.5px;font-weight:700;cursor:pointer;color:var(--accent);}
  .petunjuk ol{margin:10px 0 0 18px;font-size:12.5px;line-height:1.65;color:var(--ink-soft);}
  .petunjuk li{margin-bottom:7px;}
  .petunjuk p{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}
  .petunjuk pre{background:#F2F0E8;border-radius:8px;padding:9px;font-size:10px;overflow-x:auto;margin-top:6px;
    font-family:'IBM Plex Mono',monospace;line-height:1.45;}
  .petunjuk code{background:#F2F0E8;padding:1px 4px;border-radius:4px;font-size:11px;}
  .konf-pesan strong{color:var(--ink);}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .btn-full{width:100%;}
  .icon-btn{background:none;border:none;font-size:15px;cursor:pointer;color:var(--ink-soft);padding:2px 6px;line-height:1;}

  /* roadmap */
  .roadmap{position:relative;padding-left:22px;}
  .roadmap::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--sage-line);}
  .milestone{position:relative;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .milestone::before{content:"";position:absolute;left:-22px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);}
  .milestone.done::before{background:var(--good);}
  .milestone-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .milestone-title{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;}
  .milestone-date{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .progress-track{background:var(--sage);border-radius:6px;height:7px;margin:8px 0 6px;overflow:hidden;}
  .progress-fill{background:var(--accent);height:100%;border-radius:6px;transition:width .3s;}

  .kpr-tier{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .kpr-tier:last-child{border-bottom:none;}
  .kpr-tier.current{background:var(--accent-soft);margin:0 -16px;padding:10px 16px;border-radius:10px;border-bottom:none;}
  .tier-label{font-size:13px;font-weight:600;}
  .tier-sub{font-size:10.5px;color:var(--ink-soft);}
  .tier-amount{font-size:14px;font-weight:700;}

  /* ---- Jadwal ---- */
  .weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;}
  .weekbar .label{font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;text-align:center;flex:1;}
  .weekbar .label span{display:block;font-family:'Inter';font-size:10.5px;font-weight:500;color:var(--ink-soft);}
  .nav-btn{background:var(--sage);border:none;border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:0 0 auto;}
  .week-actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}

  .subnav{display:flex;gap:6px;margin-bottom:12px;background:#fff;padding:4px;border-radius:12px;border:1px solid var(--line);}
  .subnav button{flex:1;border:none;background:none;padding:8px 6px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;color:var(--ink-soft);}
  .subnav button.active{background:var(--ink);color:#fff;}

  .day-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .day-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .day-card.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .day-card.off{background:#FBF9F3;}
  .day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
  .day-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
  .day-date{font-size:11px;color:var(--ink-soft);margin-left:6px;}
  .day-note-select{width:auto;font-size:16px;padding:4px 6px;border-radius:8px;max-width:112px;}
  .badge-off{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--warn-soft);color:var(--warn);margin-bottom:8px;}

  .cap{margin-bottom:10px;}
  .cap-track{height:6px;border-radius:6px;background:var(--sage);overflow:hidden;display:flex;}
  .cap-fill{height:100%;background:var(--good);}
  .cap-fill.over{background:var(--warn);}
  .cap-text{font-size:10.5px;color:var(--ink-soft);margin-top:4px;}

  .task{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);}
  .task:last-of-type{border-bottom:none;}
  .task.done .task-name{text-decoration:line-through;color:var(--ink-soft);}
  .checkbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--sage-line);flex:0 0 auto;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;font-size:12px;}
  .checkbox.checked{background:var(--good);border-color:var(--good);color:#fff;}
  .task-body{flex:1;min-width:0;}
  .task-name{font-size:13.5px;line-height:1.35;word-break:break-word;}
  .task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .chip{font-size:9.5px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
  .time-text{font-size:10.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .rec-mark{font-size:10px;color:var(--ink-soft);}
  .task-actions{display:flex;gap:2px;flex:0 0 auto;}

  .goal-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .goal-row:last-of-type{border-bottom:none;}
  .goal-row.done .goal-text{text-decoration:line-through;color:var(--ink-soft);}
  .goal-text{flex:1;font-size:13.5px;}

  .empty{text-align:center;padding:18px 10px;color:var(--ink-soft);font-size:12.5px;}

  /* modal */
  #modal-bg{position:fixed;inset:0;background:rgba(23,50,41,0.45);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0;}
  #modal-bg.show{display:flex;}
  #modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;}
  #modal h3{font-size:17px;margin-bottom:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .modal-actions .btn{flex:1;}
  .daypick{display:flex;gap:5px;flex-wrap:wrap;}
  .daypick button{flex:1;min-width:38px;border:1px solid var(--line);background:#fcfbf8;border-radius:8px;padding:7px 2px;font-size:11px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .daypick button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .dur-hint{font-size:11.5px;color:var(--ink-soft);margin-top:-4px;margin-bottom:10px;}

  .cat-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block;}

  /* ---- Dompet ---- */
  .total-card{background:var(--ink);color:#F6F4EE;border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
  .total-card .label{font-size:10.5px;opacity:0.55;text-transform:uppercase;letter-spacing:0.8px;}
  .total-card .amount{font-size:27px;font-weight:700;margin-top:4px;letter-spacing:-0.5px;font-family:'IBM Plex Mono',monospace;}
  .total-card .count{font-size:11.5px;opacity:0.5;margin-top:3px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-btn{border:1px solid var(--line);background:#fcfbf8;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .chip-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .trx{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
  .trx:last-of-type{border-bottom:none;}
  .trx-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
  .trx-body{flex:1;min-width:0;}
  .trx-desc{font-size:13.5px;font-weight:500;word-break:break-word;}
  .trx-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .trx-amt{font-size:13.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .date-head{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;padding:12px 0 2px;}
  .rekap-item{padding:11px 0;border-bottom:1px solid var(--line);}
  .rekap-item:last-child{border-bottom:none;}
  .rekap-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .rekap-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .rekap-amt{font-size:13.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .rekap-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  #fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);
    background:var(--ink);color:#fff;border:none;border-radius:30px;padding:13px 22px;font-size:13.5px;font-weight:600;
    box-shadow:0 6px 20px rgba(23,50,41,0.28);cursor:pointer;z-index:50;}
  .periode-wrap{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .periode-chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fcfbf8;border-radius:20px;overflow:hidden;}
  .periode-chip.on{background:var(--accent-soft);border-color:var(--accent);}
  .periode-apply{border:none;background:none;padding:6px 4px 6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .periode-x{border:none;background:none;padding:6px 6px;font-size:11px;cursor:pointer;color:var(--ink-soft);}
  .periode-x:last-child{padding-right:10px;}
  .rp-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fcfbf8;overflow:hidden;}
  .rp-wrap:focus-within{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .rp-prefix{padding:8px 4px 8px 11px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .rp-input{border:none !important;background:transparent !important;font-size:17px !important;font-weight:600;padding:8px 11px 8px 4px !important;}
  .rp-input:focus{outline:none !important;}
  /* kalender rentang */
  .cal-wrap{display:flex;gap:20px;margin-bottom:14px;}
  .cal-month{flex:1;min-width:0;}
  .cal-month:nth-child(2){display:none;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;}
  .cal-title{font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;text-align:center;flex:1;}
  .cal-nav{width:30px;height:30px;font-size:14px;}
  .cal-nav-sp{width:30px;height:30px;flex:0 0 auto;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 0;}
  .cal-dow{font-size:9.5px;font-weight:700;text-align:center;color:var(--ink-soft);padding:2px 0 6px;text-transform:uppercase;letter-spacing:0.3px;}
  .cal-cell{position:relative;display:flex;align-items:center;justify-content:center;}
  .cal-cell.range{background:var(--accent-soft);}
  .cal-cell.range-start{border-radius:20px 0 0 20px;}
  .cal-cell.range-end{border-radius:0 20px 20px 0;}
  .cal-day{width:100%;aspect-ratio:1/1;max-height:38px;border:none;background:none;cursor:pointer;
    font-size:12.5px;font-weight:500;color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .cal-cell.out .cal-day{color:rgba(23,50,41,0.22);}
  .cal-day:hover{background:var(--sage);}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .cal-day.edge{background:var(--ink);color:#fff;font-weight:700;}
  .cal-day.edge:hover{background:var(--ink);}
  .cal-foot{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .cal-box{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:600;text-align:center;background:#fcfbf8;}
  .cal-box.aktif{border-color:var(--accent);background:var(--accent-soft);}
  .cal-dash{color:var(--ink-soft);}

  .range-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid var(--line);background:#fcfbf8;border-radius:9px;padding:11px 13px;cursor:pointer;text-align:left;}
  .range-text{font-size:13.5px;font-weight:600;color:var(--ink);}
  .range-edit{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.4px;}
  .goal-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .goal-actions .btn{flex:0 0 auto;}
  .goal-actions .btn:nth-child(3){flex:1;}
  textarea.json-box{min-height:150px;font-family:'IBM Plex Mono',monospace;font-size:16px;resize:vertical;}

  @media (min-width:860px){
    #content{padding:20px 20px 100px;}
    .day-grid{grid-template-columns:1fr 1fr;}
    #modal-bg{align-items:center;padding:20px;}
    #modal{border-radius:20px;}
    .cal-month:nth-child(2){display:block;}
    #modal:has(.cal-wrap){max-width:680px;}
  }
  @media (min-width:1200px){ .day-grid{grid-template-columns:1fr 1fr 1fr;} }
</style>
</head>
<body>

<div id="header"><div class="inner">
  <div class="eyebrow">My Journey</div>
  <h1 id="header-title">Ringkasan</h1>
  <div class="sub" id="header-sub">—</div>
</div></div>

<div id="tabs"><div class="inner">
  <button class="tab-btn" data-tab="ringkasan" onclick="setTab('ringkasan')">Ringkasan</button>
  <button class="tab-btn" data-tab="goals" onclick="setTab('goals')">Target</button>
  <button class="tab-btn" data-tab="kpr" onclick="setTab('kpr')">KPR</button>
  <button class="tab-btn" data-tab="anggaran" onclick="setTab('anggaran')">Anggaran</button>
  <button class="tab-btn" data-tab="dompet" onclick="setTab('dompet')">Dompet</button>
  <button class="tab-btn" data-tab="tugas" onclick="setTab('tugas')">Jadwal</button>
  <button class="tab-btn" data-tab="data" onclick="setTab('data')">Data</button>
</div></div>

<div id="content"></div>

<button id="fab" style="display:none" onclick="openTrxModal(null)">＋ Tambah Pengeluaran</button>
<div id="sync-pill" class="sync-pill" style="display:none"></div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>

<script>
/* Kunci penyimpanan sengaja TIDAK diganti walau nama app berubah,
   supaya data yang sudah ada tetap terbaca. */
const STORAGE_KEY = "peta-rencana-v1";
const BACKUP_KEY = "peta-rencana-cadangan-otomatis";
const APP_VERSION = "2.1";
const DAY_NAMES = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

/* ---------- storage ---------- */
function load(){
  try{
    const mentah = localStorage.getItem(STORAGE_KEY);
    if(!mentah) return structuredClone(DEFAULT_DATA);
    const raw = JSON.parse(mentah);
    /* Versi app berubah = file baru saja di-update.
       Simpan salinan apa adanya dulu sebelum struktur disesuaikan. */
    if(raw.versi !== APP_VERSION){
      try{
        localStorage.setItem(BACKUP_KEY, JSON.stringify({
          waktu:new Date().toISOString(), dariVersi:raw.versi||"?", keVersi:APP_VERSION, isi:mentah
        }));
      }catch(e){}
    }
    raw.versi = APP_VERSION;
    if(!raw.plan){
      raw.plan = structuredClone(DEFAULT_DATA.plan);
      if(Array.isArray(raw.tasks)){
        raw.plan.backlog = raw.tasks.filter(t=>!t.done).map(t=>({id:t.id,name:t.text}));
      }
    }
    if(!raw.plan.work) raw.plan.work = structuredClone(DEFAULT_DATA.plan.work);
    if(!raw.plan.categories) raw.plan.categories = structuredClone(DEFAULT_DATA.plan.categories);
    if(!raw.plan.recurring) raw.plan.recurring = [];
    if(!raw.plan.taskCats) raw.plan.taskCats = structuredClone(DEFAULT_DATA.plan.taskCats);
    if(!raw.plan.weeks) raw.plan.weeks = {};
    if(!raw.plan.backlog) raw.plan.backlog = [];
    if(!raw.dompet) raw.dompet = [];
    if(raw.budget && !raw.budget.months){
      const lama={income:Number(raw.budget.income)||0,items:raw.budget.items||[]};
      const n=new Date();
      const mk=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
      raw.budget={months:{[mk]:lama},awal:structuredClone(lama)};
    }
    if(!raw.budget) raw.budget=structuredClone(DEFAULT_DATA.budget);
    if(!raw.budget.months) raw.budget.months={};
    if(!raw.budget.awal) raw.budget.awal=structuredClone(DEFAULT_DATA.budget.awal);
    if(!raw.trxCats || !raw.trxCats.length) raw.trxCats = structuredClone(TRX_CATS_DEFAULT);
    if(!raw.periode) raw.periode = [];
    return raw;
  }catch(e){ return structuredClone(DEFAULT_DATA); }
}

/* Ambil riwayat dari app Dompet Saya lama (kalau di-deploy di alamat yang sama) */
function migrasiDompetLama(){
  if(data.migrasiDompet) return 0;
  let lama=null;
  try{ lama = JSON.parse(localStorage.getItem(DOMPET_KEY_LAMA)); }catch(e){ lama=null; }
  if(!Array.isArray(lama)){ data.migrasiDompet=true; simpanTanpaTanda(); return 0; }
  const ada = new Set(data.dompet.map(t=>String(t.id)));
  let n=0;
  lama.forEach(t=>{
    if(!t || ada.has(String(t.id))) return;
    data.dompet.push({id:t.id,tanggal:t.tanggal,keterangan:t.keterangan,jumlah:Number(t.jumlah)||0,kategori:t.kategori||"Lainnya"});
    n++;
  });
  data.migrasiDompet=true;
  if(n>0) save(); else simpanTanpaTanda();
  return n;
}

/* ---------- helpers ---------- */
const fmt = n => "Rp " + Math.round(n||0).toLocaleString("id-ID");
const fmtShort = n => {
  n = Math.round(n||0);
  if(Math.abs(n)>=1e9) return (n/1e9).toLocaleString("id-ID",{maximumFractionDigits:2})+" M";
  if(Math.abs(n)>=1e6) return (n/1e6).toLocaleString("id-ID",{maximumFractionDigits:1})+" jt";
  return fmt(n);
};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function parseDate(s){ return new Date(s+"T00:00:00"); }
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function mondayKey(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const wd = x.getDay(); // 0=Sun
  const diff = wd===0 ? -6 : 1-wd;
  x.setDate(x.getDate()+diff);
  return dateKey(x);
}
function addDays(key,n){ const d=parseDate(key); d.setDate(d.getDate()+n); return dateKey(d); }
function weeksBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/604800000); }
function fmtDate(s){ return s ? parseDate(s).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}) : ""; }
function fmtDayShort(s){ return parseDate(s).toLocaleDateString("id-ID",{day:"numeric",month:"short"}); }
function toMin(t){ if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; }
function durMin(a,b){ const s=toMin(a),e=toMin(b); if(s==null||e==null) return 0; return Math.max(0,e-s); }
function fmtDur(mins){
  if(!mins) return "";
  const h=Math.floor(mins/60), m=mins%60;
  if(h&&m) return `${h} jam ${m} menit`;
  if(h) return `${h} jam`;
  return `${m} menit`;
}
function daysUntil(s){ if(!s) return null; const d=parseDate(s); const n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }
function sisaWaktu(s){
  if(!s) return null;
  const target=parseDate(s); const now=new Date(); now.setHours(0,0,0,0);
  const hari=Math.round((target-now)/86400000);
  if(hari<0) return {lewat:true,text:"sudah lewat",hari};
  if(hari===0) return {lewat:false,text:"hari ini",hari};
  let y=target.getFullYear()-now.getFullYear();
  let m=target.getMonth()-now.getMonth();
  let d=target.getDate()-now.getDate();
  if(d<0){ m--; d+=new Date(target.getFullYear(),target.getMonth(),0).getDate(); }
  if(m<0){ m+=12; y--; }
  const bagian=[];
  if(y) bagian.push(y+" tahun");
  if(m) bagian.push(m+" bulan");
  if(d||!bagian.length) bagian.push(d+" hari");
  return {lewat:false,text:bagian.join(" "),hari};
}
function taskCats(){ return (data.plan.taskCats&&data.plan.taskCats.length)?data.plan.taskCats:[]; }
function taskCatById(id){ return taskCats().find(c=>c.id===id)||null; }

/* ---------- budget/kpr helpers ---------- */
function monthKeyOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function fmtMonth(mk){
  const [y,m]=mk.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"});
}
function shiftMonthKey(mk,n){
  const [y,m]=mk.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  return monthKeyOf(d);
}
function getBudget(mk){
  if(!mk) mk=budgetMonth||monthKeyOf(new Date());
  const M=data.budget.months;
  if(!M[mk]){
    const sebelum=Object.keys(M).filter(k=>k<mk).sort();
    const src = sebelum.length ? M[sebelum[sebelum.length-1]] : data.budget.awal;
    M[mk]={income:Number(src.income)||0,items:structuredClone(src.items||[]),warisan:true};
  }
  return M[mk];
}
function totalOutcome(mk){ return getBudget(mk||monthKeyOf(new Date())).items.reduce((s,i)=>s+Number(i.amount||0),0); }
function freeUang(mk){ const b=getBudget(mk||monthKeyOf(new Date())); return Number(b.income||0)-totalOutcome(mk); }
function currentKprInfo(){
  const tiers=(data.kpr&&data.kpr.tiers)||[];
  if(!tiers.length) return null;
  const elapsed = new Date().getFullYear()-Number(data.kpr.startYear)+1;
  let acc=0;
  for(const t of tiers){
    const from=acc+1,to=acc+(Number(t.years)||1);
    if(elapsed<=to || t===tiers[tiers.length-1]) return {tier:t,tahunKe:Math.max(1,elapsed),from,to};
    acc=to;
  }
  return {tier:tiers[0],tahunKe:1,from:1,to:Number(tiers[0].years)||1};
}
function nextKprStep(){
  const info=currentKprInfo();
  if(!info) return null;
  const tiers=data.kpr.tiers;
  const idx=tiers.indexOf(info.tier);
  if(idx<0||idx===tiers.length-1) return null;
  const next=tiers[idx+1];
  return {next,yearsLeft:info.to-info.tahunKe+1,delta:next.amount-info.tier.amount};
}

/* ---------- week model ---------- */
function getWeek(key){
  if(!data.plan.weeks[key]) data.plan.weeks[key]={goals:[],tasks:[],dayNotes:{},recDone:{},recSkip:{}};
  const w=data.plan.weeks[key];
  w.goals=w.goals||[]; w.tasks=w.tasks||[]; w.dayNotes=w.dayNotes||{}; w.recDone=w.recDone||{}; w.recSkip=w.recSkip||{};
  return w;
}
function ruleActiveOn(rule,dateStr,wkKey){
  const wd = parseDate(dateStr).getDay();
  if(!rule.days.includes(wd)) return false;
  if(rule.freq==="biweekly"){
    const anchor = rule.anchor || wkKey;
    return Math.abs(weeksBetween(anchor,wkKey))%2===0;
  }
  return true;
}
function tasksForDay(wkKey,dateStr){
  const w=getWeek(wkKey);
  const out=[];
  data.plan.recurring.forEach(r=>{
    if(!ruleActiveOn(r,dateStr,wkKey)) return;
    const iid = `${r.id}@${dateStr}`;
    if(w.recSkip[iid]) return;
    out.push({id:iid,rec:true,ruleId:r.id,name:r.name,cat:r.cat,kat:r.kat||"",prio:r.prio,start:r.start,end:r.end,done:!!w.recDone[iid]});
  });
  w.tasks.filter(t=>t.date===dateStr).forEach(t=>out.push({...t,rec:false}));
  out.sort((a,b)=>{
    const sa=toMin(a.start), sb=toMin(b.start);
    if(sa==null&&sb==null) return 0;
    if(sa==null) return 1;
    if(sb==null) return -1;
    return sa-sb;
  });
  return out;
}
function workCapacity(){
  const w=data.plan.work;
  return Math.max(0, durMin(w.start,w.end)-durMin(w.breakStart,w.breakEnd));
}
function usedOfficeMin(wkKey,dateStr){
  return tasksForDay(wkKey,dateStr)
    .filter(t=>t.cat==="c-kantor" || catById(t.cat).name.toLowerCase()==="kantor")
    .reduce((s,t)=>s+durMin(t.start,t.end),0);
}

function setDompetSub(v){ dompetSub=v; render(); }
function setFilter(f,v){ dompetFilter[f]=v; render(); }
function resetFilter(){ dompetFilter={from:"",to:"",cat:"Semua"}; render(); }

    const rows=byDate[d].map(t=>{
      const c=trxCfg(t.kategori);
      return `
        <div class="trx">
          <div class="trx-icon" style="background:${c.bg}">${c.icon}</div>
          <div class="trx-body">
            <div class="trx-desc">${esc(t.keterangan)}</div>
            <div class="trx-sub" style="color:${c.text}">${esc(t.kategori)}</div>
          </div>
          <div class="trx-amt">${fmt(t.jumlah)}</div>
          <div class="task-actions">
            <button class="icon-btn" onclick="openTrxModal('${t.id}')">✎</button>
            <button class="icon-btn" onclick="askHapusTrx('${t.id}')">✕</button>
          </div>
        </div>`;
    }).join('');
    return `<div class="date-head">${fmtDate(d)} · ${fmt(dayTotal)}</div><div class="card" style="margin-bottom:0">${rows}</div>`;
  }).join('');
  return head+filterCard+body;
}

/* --- rentang tanggal --- */
function labelRentang(){
  const f=dompetFilter.from, t=dompetFilter.to;
  const o={day:"numeric",month:"short",year:"numeric"};
  if(!f&&!t) return "Semua tanggal";
  if(f&&!t) return `Sejak ${parseDate(f).toLocaleDateString("id-ID",o)}`;
  if(!f&&t) return `Sampai ${parseDate(t).toLocaleDateString("id-ID",o)}`;
  return `${parseDate(f).toLocaleDateString("id-ID",o)} – ${parseDate(t).toLocaleDateString("id-ID",o)}`;
}
let cal={from:"",to:"",month:""};
function openRentangModal(){
  modalState={type:'rentang'};
  cal={from:dompetFilter.from,to:dompetFilter.to,month:(dompetFilter.from||dateKey(new Date())).slice(0,7)};
  openModal(calHtml());
}
function calRefresh(){ document.getElementById("modal").innerHTML=calHtml(); }
function calShift(n){ cal.month=shiftMonthKey(cal.month,n); calRefresh(); }
function calPick(d){
  if(!cal.from || (cal.from && cal.to)){ cal.from=d; cal.to=""; }
  else if(d<cal.from){ cal.from=d; }
  else { cal.to=d; }
  calRefresh();
}
function calPreset(jenis){
  const n=new Date();
  if(jenis==="bulanIni"){
    cal.from=dateKey(new Date(n.getFullYear(),n.getMonth(),1));
    cal.to=dateKey(new Date(n.getFullYear(),n.getMonth()+1,0));
  }else if(jenis==="bulanLalu"){
    cal.from=dateKey(new Date(n.getFullYear(),n.getMonth()-1,1));
    cal.to=dateKey(new Date(n.getFullYear(),n.getMonth(),0));
  }else if(jenis==="30hari"){
    const a=new Date(n); a.setDate(a.getDate()-29);
    cal.from=dateKey(a); cal.to=dateKey(n);
  }else{ cal.from=""; cal.to=""; }
  if(cal.from) cal.month=cal.from.slice(0,7);
  calRefresh();
}
function calBulanHtml(mk,tampilPanahKiri,tampilPanahKanan){
  const [y,m]=mk.split("-").map(Number);
  const pertama=new Date(y,m-1,1);
  const geser=(pertama.getDay()+6)%7;              // Senin = 0
  const jmlHari=new Date(y,m,0).getDate();
  const hariBulanLalu=new Date(y,m-1,0).getDate();
  const hariIni=dateKey(new Date());
  const dow=["Sn","Sl","Rb","Km","Jm","Sb","Mg"].map(d=>`<div class="cal-dow">${d}</div>`).join("");

  let sel="";
  for(let i=0;i<42;i++){
    let tgl,luar=false;
    if(i<geser){ tgl=new Date(y,m-2,hariBulanLalu-geser+i+1); luar=true; }
    else if(i-geser<jmlHari){ tgl=new Date(y,m-1,i-geser+1); }
    else { tgl=new Date(y,m,i-geser-jmlHari+1); luar=true; }
    const k=dateKey(tgl);
    const isFrom=cal.from&&k===cal.from, isTo=cal.to&&k===cal.to;
    const dalam=cal.from&&cal.to&&k>cal.from&&k<cal.to;
    const kelasSel=[
      dalam?"range":"",
      isFrom&&cal.to?"range range-start":"",
      isTo?"range range-end":"",
      luar?"out":"",
    ].filter(Boolean).join(" ");
    const kelasHari=[
      (isFrom||isTo)?"edge":"",
      k===hariIni?"today":"",
    ].filter(Boolean).join(" ");
    sel+=`<div class="cal-cell ${kelasSel}"><button class="cal-day ${kelasHari}" onclick="calPick('${k}')">${tgl.getDate()}</button></div>`;
  }
  return `
    <div class="cal-month">
      <div class="cal-head">
        ${tampilPanahKiri?`<button class="nav-btn cal-nav" onclick="calShift(-1)">‹</button>`:`<span class="cal-nav-sp"></span>`}
        <div class="cal-title">${fmtMonth(mk)}</div>
        ${tampilPanahKanan?`<button class="nav-btn cal-nav" onclick="calShift(1)">›</button>`:`<span class="cal-nav-sp"></span>`}
      </div>
      <div class="cal-grid">${dow}${sel}</div>
    </div>`;
}
function calHtml(){
  const o={day:"numeric",month:"short",year:"numeric"};
  const teksFrom=cal.from?parseDate(cal.from).toLocaleDateString("id-ID",o):"Tanggal awal";
  const teksTo=cal.to?parseDate(cal.to).toLocaleDateString("id-ID",o):"Tanggal akhir";
  return `
    <h3>Rentang Tanggal</h3>
    <div class="chips" style="margin-bottom:14px">
      <button class="chip-btn" onclick="calPreset('bulanIni')">Bulan ini</button>
      <button class="chip-btn" onclick="calPreset('bulanLalu')">Bulan lalu</button>
      <button class="chip-btn" onclick="calPreset('30hari')">30 hari terakhir</button>
      <button class="chip-btn" onclick="calPreset('semua')">Semua</button>
    </div>
    <div class="cal-wrap">
      ${calBulanHtml(cal.month,true,false)}
      ${calBulanHtml(shiftMonthKey(cal.month,1),false,true)}
    </div>
    <div class="cal-foot">
      <div class="cal-box ${cal.from&&!cal.to?'aktif':''}">${teksFrom}</div>
      <span class="cal-dash">–</span>
      <div class="cal-box">${teksTo}</div>
    </div>
    <div class="small muted" style="text-align:center;margin-bottom:10px">
      ${!cal.from?"Ketuk tanggal awal.":(!cal.to?"Sekarang ketuk tanggal akhir.":"Ketuk tanggal lain untuk mulai memilih ulang.")}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="terapkanRentang()">Terapkan</button>
    </div>`;
}

  if(cal.from&&!cal.to){ alert("Tanggal akhir belum dipilih."); return; }
  dompetFilter.from=cal.from; dompetFilter.to=cal.to;
  closeModal(); render();
}

function simpanPeriode(){

    Object.assign(data.periode.find(x=>x.id===modalState.id),{name:nama,from,to});
  }else{
    data.periode.push({id:uid('p'),name:nama,from,to});

function simpanKat(){
  const nama=document.getElementById("k-nama").value.trim();
  const icon=document.getElementById("k-icon").value.trim()||"💸";
  const color=document.getElementById("k-color").value;
  if(!nama){ alert("Nama kategori belum diisi."); return; }
  if(!data.trxCats||!data.trxCats.length) data.trxCats=structuredClone(TRX_CATS_DEFAULT);
  const bentrok=data.trxCats.find(c=>c.name.toLowerCase()===nama.toLowerCase() && c.name!==modalState.nama);
  if(bentrok){ alert("Sudah ada kategori dengan nama itu."); return; }
  if(modalState.nama){
    const c=data.trxCats.find(x=>x.name===modalState.nama);
    const lama=c.name;
    Object.assign(c,{name:nama,icon,color});
    if(lama!==nama){
      data.dompet.forEach(t=>{ if(t.kategori===lama) t.kategori=nama; });
      data.periode.forEach(()=>{});
      if(dompetFilter.cat===lama) dompetFilter.cat=nama;
    }
  }else{
    data.trxCats.push({name:nama,icon,color});
  }
  save(); closeModal(); render();
}
function hapusKat(nama){
  if(!data.trxCats||!data.trxCats.length) data.trxCats=structuredClone(TRX_CATS_DEFAULT);
  if(data.trxCats.length<=1){ alert("Minimal harus ada satu kategori."); return; }
  const dipakai=data.dompet.filter(t=>t.kategori===nama);
  const sisa=data.trxCats.filter(c=>c.name!==nama);
  const tujuan=sisa.find(c=>c.name==="Lainnya")||sisa[0];
  const pesan = dipakai.length
    ? `Hapus kategori "${nama}"? ${dipakai.length} transaksi yang memakainya akan dipindahkan ke "${tujuan.name}" (transaksinya tidak hilang).`
    : `Hapus kategori "${nama}"?`;
  konfirmasi({judul:'Hapus kategori ini?',pesan},()=>{
    dipakai.forEach(t=>t.kategori=tujuan.name);
    data.trxCats=sisa;
    if(dompetFilter.cat===nama) dompetFilter.cat="Semua";
    save(); render();
  });
}

function renderRekap(list,total){
  const rekap=trxCatNames().map(k=>({
    kategori:k,
    total:list.filter(t=>t.kategori===k).reduce((s,t)=>s+Number(t.jumlah||0),0),
    count:list.filter(t=>t.kategori===k).length,
  })).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  if(!rekap.length) return `<div class="card"><div class="empty">Belum ada data untuk direkap.</div></div>`;
  const rows=rekap.map(r=>{
    const c=trxCfg(r.kategori);
    const pct=total?Math.round(r.total/total*100):0;
    return `
      <div class="rekap-item">
        <div class="rekap-top">
          <div class="rekap-name"><span class="cat-dot" style="background:${c.dot}"></span>${c.icon} ${esc(r.kategori)}</div>
          <div class="rekap-amt">${fmt(r.total)}</div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${c.dot}"></div></div>
        <div class="rekap-sub">${pct}% · ${r.count} transaksi</div>
      </div>`;
  }).join('');
  return `<div class="card"><h3>Rekap per Kategori</h3>${rows}</div>`;
}

function simpanTrx(){
  const tanggal=document.getElementById("t-tanggal").value;
  const keterangan=document.getElementById("t-ket").value.trim();
  const jumlah=parseRupiah(document.getElementById("t-jumlah").value);
  const kategori=document.getElementById("t-kat").value;
  if(!tanggal){ alert("Tanggal belum diisi."); return; }
  if(!keterangan){ alert("Keterangan belum diisi."); return; }
  if(!jumlah||jumlah<=0){ alert("Jumlah harus lebih dari 0."); return; }
  if(modalState.id){
    const t=data.dompet.find(x=>String(x.id)===String(modalState.id));
    Object.assign(t,{tanggal,keterangan,jumlah,kategori});
  }else{
    data.dompet.push({id:Date.now(),tanggal,keterangan,jumlah,kategori});
  }
  data.dompet.sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  save(); closeModal(); render();

function unduhCadangan(){
  try{
    const isi=JSON.stringify(data);
    const blob=new Blob([isi],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`my-journey-${dateKey(new Date())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ alert("Gagal membuat berkas. Pakai cara salin manual di bawah."); }
}
function muatBerkasCadangan(ev){
  const f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const box=document.getElementById("import-box");
    if(box) box.value=r.result;
    terapkanImpor(String(r.result));
    ev.target.value="";
  };
  r.onerror=()=>alert("Berkas tidak terbaca.");
  r.readAsText(f);
}
function pulihkanCadanganOtomatis(){
  const b=JSON.parse(localStorage.getItem(BACKUP_KEY)||"null");
  if(!b||!b.isi){ alert("Tidak ada salinan pengaman."); return; }
  konfirmasi({judul:'Pulihkan salinan pengaman?',ya:'Pulihkan',
    pesan:'Seluruh isi app dikembalikan ke kondisi salinan tersebut. Semua perubahan setelah itu akan hilang.'},
    ()=>{
      localStorage.setItem(STORAGE_KEY,b.isi);
      data=load(); save();
      alert("Data dikembalikan ke salinan pengaman.");
      render();
    });
}
function salinEkspor(){
  const box=document.getElementById("export-box");
  box.select(); box.setSelectionRange(0,999999);
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  if(navigator.clipboard){ navigator.clipboard.writeText(box.value).then(()=>{},()=>{}); ok=true; }
  alert(ok?"Data tersalin. Simpan di tempat aman.":"Salin manual: teksnya sudah tersorot, tekan lama lalu pilih Copy.");
}
function jalankanImpor(){
  const raw=document.getElementById("import-box").value.trim();
  if(!raw){ alert("Belum ada teks yang ditempel."); return; }
  terapkanImpor(raw);
}
function terapkanImpor(raw){
  let masuk;
  try{ masuk=JSON.parse(raw); }catch(e){ alert("Teks tidak terbaca. Pastikan tersalin lengkap dari awal { sampai akhir }."); return; }
  if(typeof masuk!=="object"||masuk===null){ alert("Isi cadangan tidak valid."); return; }
  const jml=Array.isArray(masuk.dompet)?masuk.dompet.length:0;
  konfirmasi({judul:'Impor data ini?',aman:true,ya:'Impor',
    pesan:`<strong>${jml} transaksi</strong> akan digabung dengan yang sudah ada — tidak ada yang hilang.<br><br>Anggaran, KPR, target, dan jadwal akan <strong>diganti</strong> oleh isi cadangan.`},
    ()=>lanjutkanImpor(masuk));
}
function lanjutkanImpor(masuk){
  try{ localStorage.setItem(BACKUP_KEY,JSON.stringify({waktu:new Date().toISOString(),dariVersi:APP_VERSION,keVersi:APP_VERSION,isi:JSON.stringify(data)})); }catch(e){}
  if(Array.isArray(masuk.dompet)){
    const ada=new Set(data.dompet.map(t=>String(t.id)));
    masuk.dompet.forEach(t=>{ if(t&&!ada.has(String(t.id))) data.dompet.push(t); });
    data.dompet.sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
  }
  if(masuk.budget) data.budget=masuk.budget;
  if(masuk.kpr) data.kpr=masuk.kpr;
  if(Array.isArray(masuk.goals)) data.goals=masuk.goals;
  if(masuk.plan) data.plan=masuk.plan;
  if(Array.isArray(masuk.trxCats)&&masuk.trxCats.length) data.trxCats=masuk.trxCats;
  if(Array.isArray(masuk.periode)) data.periode=masuk.periode;
  save();
  alert("Impor selesai. Kalau hasilnya tidak sesuai, salinan pengaman bisa dipulihkan di kartu paling atas.");
  render();
}

function renderGoals(){
  if(!data.goals.length) return `<div class="card"><div class="empty">Belum ada target. Tambahkan yang pertama.</div></div>
    <button class="btn btn-accent btn-full" onclick="openGoalModal(null)">+ Tambah target</button>`;
  const items=data.goals.map((g,i)=>{
    const pct=g.target>0?Math.min(100,Math.round(g.current/g.target*100)):0;
    const s=g.date?sisaWaktu(g.date):null;
    return `
      <div class="milestone ${g.target>0&&g.current>=g.target?'done':''}">
        <div class="milestone-head">
          <span class="milestone-title">${esc(g.name)}</span>
          <span class="milestone-date">${g.date?fmtDate(g.date):'tanpa tanggal'}</span>
        </div>
        ${s?`<div class="small ${s.lewat?'muted':''}" style="margin-top:3px">${s.lewat?'Sudah lewat':'Tinggal '+s.text}</div>`:''}
        ${g.target>0?`
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="small muted">${fmt(g.current)} dari ${fmt(g.target)} · ${pct}% · sisa ${fmtShort(Math.max(0,g.target-g.current))}</div>
        `:`<div class="small muted section-gap">Target biaya belum diisi.</div>`}
        ${g.note?`<div class="small muted" style="margin-top:6px">${esc(g.note)}</div>`:''}
        <div class="goal-actions">
          <button class="btn btn-line btn-sm" onclick="moveGoal(${i},-1)" ${i===0?'disabled style="opacity:.35"':''}>↑</button>
          <button class="btn btn-line btn-sm" onclick="moveGoal(${i},1)" ${i===data.goals.length-1?'disabled style="opacity:.35"':''}>↓</button>
          <button class="btn btn-ghost btn-sm" onclick="openGoalModal('${g.id}')">Ubah</button>
          <button class="btn btn-warn btn-sm" onclick="hapusGoal('${g.id}')">Hapus</button>
        </div>
      </div>`;
  }).join('');
  return `<div class="roadmap">${items}</div>
    <button class="btn btn-accent btn-full" onclick="openGoalModal(null)">+ Tambah target</button>
    <div class="small muted section-gap" style="text-align:center">Pakai ↑ ↓ untuk mengatur urutan prioritas.</div>`;
}
function moveGoal(i,dir){
  const j=i+dir;
  if(j<0||j>=data.goals.length) return;
  [data.goals[i],data.goals[j]]=[data.goals[j],data.goals[i]];
  save(); render();
}
function hapusGoal(id){
  const g=data.goals.find(x=>x.id===id); if(!g) return;
  konfirmasi({judul:'Hapus target ini?',
    pesan:`<strong>${esc(g.name)}</strong>${g.target>0?`<br>Progres tersimpan ${fmt(g.current)} dari ${fmt(g.target)}`:''}<br><br>Catatan dan progresnya ikut terhapus.`},
    ()=>{ data.goals=data.goals.filter(x=>x.id!==id); save(); render(); });
}

function formatRupiahGoal(el,hintId){

function renderDayCard(dateStr,isToday){
  const w=getWeek(weekKey);
  const d=parseDate(dateStr);
  const wd=d.getDay();
  const note=w.dayNotes[dateStr]||{type:"Normal",text:""};
  const isOff=["Cuti","Libur","Sakit"].includes(note.type);
  const isWorkday=data.plan.work.days.includes(wd);
  const list=tasksForDay(weekKey,dateStr);

  const tasksHtml=list.length?list.map(t=>{
    const c=catById(t.cat), p=PRIORITIES[t.prio]||PRIORITIES["Rutin"];
    const kt=taskCatById(t.kat);
    const dur=durMin(t.start,t.end);
    return `
      <div class="task ${t.done?'done':''}">
        <div class="checkbox ${t.done?'checked':''}" onclick="toggleTask('${dateStr}','${t.id}',${t.rec})">${t.done?'✓':''}</div>
        <div class="task-body">
          <div class="task-name">${esc(t.name)}${t.rec?' <span class="rec-mark">↻</span>':''}</div>
          <div class="task-meta">
            <span class="chip" style="background:${p.bg};color:${p.fg}">${t.prio||'Rutin'}</span>
            <span class="chip" style="background:${c.color}1A;color:${c.color}">${esc(c.name)}</span>
            ${kt?`<span class="chip" style="background:${kt.color};color:#fff">${esc(kt.name)}</span>`:''}
            ${t.start&&t.end?`<span class="time-text">${t.start}–${t.end} · ${fmtDur(dur)}</span>`:`<span class="time-text">tanpa jam</span>`}
          </div>
        </div>
        <div class="task-actions">
          ${t.rec?`<button class="icon-btn" title="Lewati minggu ini" onclick="skipRec('${dateStr}','${t.id}')">✕</button>`
                 :`<button class="icon-btn" title="Ubah" onclick="openTaskModal('${dateStr}','${t.id}')">✎</button>
                   <button class="icon-btn" onclick="removeTask('${t.id}')">✕</button>`}
        </div>
      </div>`;
  }).join(''):`<div class="empty">Belum ada tugas.</div>`;

  let capHtml="";
  if(isWorkday && !isOff){
    const cap=workCapacity(), used=usedOfficeMin(weekKey,dateStr);
    const pct=cap?Math.min(100,Math.round(used/cap*100)):0;
    const over=used>cap;
    capHtml=`<div class="cap">
      <div class="cap-track"><div class="cap-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      <div class="cap-text">Jam kantor terpakai ${fmtDur(used)||'0 menit'} dari ${fmtDur(cap)}${over?' — kelebihan':''}</div>
    </div>`;
  }

  const opts=DAY_NOTE_TYPES.map(t=>`<option ${note.type===t?'selected':''}>${t}</option>`).join('');

  return `
    <div class="day-card ${isToday?'today':''} ${isOff?'off':''}">
      <div class="day-head">
        <div><span class="day-name">${DAY_NAMES[wd]}</span><span class="day-date">${fmtDayShort(dateStr)}</span></div>
        <select class="day-note-select" onchange="setDayNote('${dateStr}',this.value)">${opts}</select>
      </div>
      ${isOff?`<div class="badge-off">${note.type}</div>`:''}
      ${capHtml}
      ${tasksHtml}
      <button class="btn btn-ghost btn-sm btn-full section-gap" onclick="openTaskModal('${dateStr}',null)">+ Tambah tugas</button>
    </div>`;
}

/* week actions */
function shiftWeek(n){ weekKey=addDays(weekKey,n*7); render(); }
function goToday(){ weekKey=mondayKey(new Date()); render(); }
function setDayNote(dateStr,type){
  const w=getWeek(weekKey);
  w.dayNotes[dateStr]={type,text:(w.dayNotes[dateStr]||{}).text||""};
  save(); render();
}
function copyWeek(dir){
  const src = dir===-1 ? addDays(weekKey,-7) : weekKey;
  const dst = dir===-1 ? weekKey : addDays(weekKey,7);
  const s=getWeek(src), t=getWeek(dst);
  if(!s.tasks.length && !s.goals.length){ alert("Minggu sumber masih kosong, tidak ada yang bisa disalin."); return; }
  if(t.tasks.length){
    konfirmasi({judul:'Minggu tujuan sudah berisi tugas',aman:true,ya:'Tetap salin',
      pesan:`Ada ${t.tasks.length} tugas di minggu tujuan. Salinan akan <strong>ditambahkan</strong>, bukan menimpa.`},
      ()=>lakukanSalinMinggu(src,dst,dir));
    return;
  }
  lakukanSalinMinggu(src,dst,dir);
}
function lakukanSalinMinggu(src,dst,dir){
  const s=getWeek(src), t=getWeek(dst);
  s.tasks.forEach(task=>{
    const offset=Math.round((parseDate(task.date)-parseDate(src))/86400000);
    t.tasks.push({...task,id:uid('t'),date:addDays(dst,offset),done:false});
  });
  s.goals.forEach(g=>t.goals.push({id:uid('wg'),name:g.name,done:false}));
  save();
  if(dir===1) weekKey=dst;
  render();
}

function removeWeekGoal(id){

/* tasks */
function toggleTask(dateStr,id,isRec){
  const w=getWeek(weekKey);
  if(isRec){ w.recDone[id]=!w.recDone[id]; }
  else { const t=w.tasks.find(x=>x.id===id); if(t) t.done=!t.done; }
  save(); render();
}
function skipRec(dateStr,iid){
  konfirmasi({judul:'Lewati untuk tanggal ini?',aman:true,ya:'Lewati',
    pesan:'Tugas rutin ini hanya dihilangkan pada tanggal ini. Minggu berikutnya tetap muncul seperti biasa.'},
    ()=>{ getWeek(weekKey).recSkip[iid]=true; save(); render(); });
}
function removeTask(id){
  const w=getWeek(weekKey); const t=w.tasks.find(x=>x.id===id); if(!t) return;
  konfirmasi({judul:'Hapus tugas ini?',
    pesan:`<strong>${esc(t.name)}</strong>${t.start&&t.end?`<br>${t.start}–${t.end}`:''}`},
    ()=>{ const ww=getWeek(weekKey); ww.tasks=ww.tasks.filter(x=>x.id!==id); save(); render(); });

function hapusTaskCat(id){

/* ---------- MODAL ---------- */
let aksiKonfirmasi=null;
function konfirmasi(opsi,aksi){
  aksiKonfirmasi=aksi;
  openModal(`

    <div class="konf-pesan">${opsi.pesan||''}</div>
    <div class="modal-actions">

      <button class="btn ${opsi.aman?'btn-accent':'btn-danger'}" onclick="jalankanKonfirmasi()">${esc(opsi.ya||'Hapus')}</button>
    </div>`);
}
function batalKonfirmasi(){ aksiKonfirmasi=null; closeModal(); }
function jalankanKonfirmasi(){
  const a=aksiKonfirmasi; aksiKonfirmasi=null; closeModal();
  if(typeof a==='function') a();
}
function openModal(html){
  document.getElementById("modal").innerHTML=html;
  document.getElementById("modal-bg").classList.add("show");
}
function closeModal(){ document.getElementById("modal-bg").classList.remove("show"); modalState=null; }

function taskCatOptions(sel){
  return `<option value="">— tanpa kategori —</option>`+
    taskCats().map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
}
function catOptions(sel){ return data.plan.categories.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join(''); }
function prioOptions(sel){ return Object.keys(PRIORITIES).map(p=>`<option ${p===sel?'selected':''}>${p}</option>`).join(''); }

function openTaskModal(dateStr,taskId,prefillName,backlogId){

  const bItem = backlogId ? data.plan.backlog.find(x=>x.id===backlogId) : null;

    ${backlogId?`<div class="small muted" style="margin-bottom:12px">Setelah disimpan, ide ini pindah dari Bak Ide ke tanggal yang Anda pilih.</div>`:''}
    <div class="field"><span class="field-label">Nama tugas</span>
      <input type="text" id="m-name" value="${esc(t?t.name:(bItem?bItem.name:(prefillName||'')))}" placeholder="Contoh: telepon calon tukang" /></div>
    <div class="field-row">
      <div class="field"><span class="field-label">Jenis</span><select id="m-cat">${catOptions(t?t.cat:(bItem&&bItem.cat?bItem.cat:data.plan.categories[0].id))}</select></div>
      <div class="field"><span class="field-label">Prioritas</span><select id="m-prio">${prioOptions(t?t.prio:(bItem&&bItem.prio?bItem.prio:'Medium'))}</select></div>

    <div class="field"><span class="field-label">Tanggal</span><input type="date" id="m-date" value="${t?t.date:dateStr}" /></div>
    <div class="field-row">
      <div class="field"><span class="field-label">Mulai</span><input type="time" id="m-start" value="${t?t.start||'':''}" oninput="updateDurHint()" /></div>
      <div class="field"><span class="field-label">Selesai</span><input type="time" id="m-end" value="${t?t.end||'':''}" oninput="updateDurHint()" /></div>
    </div>
    <div class="dur-hint" id="m-dur">Durasi otomatis dihitung dari jam mulai & selesai.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="saveTaskModal()">Simpan</button>
    </div>`);
  updateDurHint();
}
function updateDurHint(){
  const s=document.getElementById("m-start"), e=document.getElementById("m-end"), h=document.getElementById("m-dur");
  if(!s||!e||!h) return;
  const d=durMin(s.value,e.value);
  h.textContent = d ? `Durasi: ${fmtDur(d)}` : "Durasi otomatis dihitung dari jam mulai & selesai.";
}
function saveTaskModal(){
  const name=document.getElementById("m-name").value.trim();
  if(!name){ alert("Nama tugas belum diisi."); return; }
  const date=document.getElementById("m-date").value;
  if(!date){ alert("Tanggal belum diisi."); return; }
  const start=document.getElementById("m-start").value;
  const end=document.getElementById("m-end").value;
  if(start&&end&&toMin(end)<=toMin(start)){ alert("Jam selesai harus lebih besar dari jam mulai."); return; }
  const payload={name,cat:document.getElementById("m-cat").value,kat:document.getElementById("m-kat").value,prio:document.getElementById("m-prio").value,date,start,end};
  const targetWeek=mondayKey(parseDate(date));
  const w=getWeek(targetWeek);
  if(modalState.taskId){
    const cur=getWeek(weekKey);
    const idx=cur.tasks.findIndex(x=>x.id===modalState.taskId);
    const old=cur.tasks[idx];
    cur.tasks.splice(idx,1);
    w.tasks.push({...old,...payload});
  }else{
    w.tasks.push({id:uid('t'),done:false,...payload});
  }
  if(modalState.backlogId) data.plan.backlog=data.plan.backlog.filter(b=>b.id!==modalState.backlogId);
  weekKey=targetWeek;
  save(); closeModal(); render();
}

  openModal(`

/* ---------- util ---------- */
function kanonik(v){
  if(v===null||typeof v!=="object") return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v)) return "["+v.map(kanonik).join(",")+"]";
  return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+kanonik(v[k])).join(",")+"}";
}

/* ---------- bentuk data: lokal ⇄ firestore ---------- */
function keAnggaran(b){
  const pos={}, ord=[];
  (b.items||[]).forEach(it=>{ ord.push(it.id); pos[it.id]={n:it.name||"",a:Number(it.amount)||0}; });
  const o={income:Number(b.income)||0, ord, pos};
  if(b.warisan) o.warisan=true;
  return o;
}
function dariAnggaran(d){
  const ord = Array.isArray(d.ord) ? d.ord : Object.keys(d.pos||{});
  const items = ord.filter(id=>d.pos&&d.pos[id]).map(id=>({id, name:d.pos[id].n||"", amount:Number(d.pos[id].a)||0}));
  const o={income:Number(d.income)||0, items};
  if(d.warisan) o.warisan=true;
  return o;
}
function keMinggu(w){
  const wg={}, wgOrd=[], tasks={}, tOrd=[];
  (w.goals||[]).forEach(g=>{ const c={...g}; delete c.id; wgOrd.push(g.id); wg[g.id]=c; });
  (w.tasks||[]).forEach(t=>{ const c={...t}; delete c.id; tOrd.push(t.id); tasks[t.id]=c; });
  return {wg,wgOrd,tasks,tOrd,dayNotes:w.dayNotes||{},recDone:w.recDone||{},recSkip:w.recSkip||{}};
}
function dariMinggu(d){
  const wgOrd = Array.isArray(d.wgOrd) ? d.wgOrd : Object.keys(d.wg||{});
  const tOrd  = Array.isArray(d.tOrd)  ? d.tOrd  : Object.keys(d.tasks||{});
  return {
    goals: wgOrd.filter(i=>d.wg&&d.wg[i]).map(i=>({id:i,...d.wg[i]})),
    tasks: tOrd.filter(i=>d.tasks&&d.tasks[i]).map(i=>({id:i,...d.tasks[i]})),
    dayNotes:d.dayNotes||{}, recDone:d.recDone||{}, recSkip:d.recSkip||{}
  };
}

/* Seluruh isi app, dipotong jadi dokumen-dokumen kecil */
function petaLokal(){
  const m={};
  m["meta/target"]     = {goals:data.goals||[]};
  m["meta/kpr"]        = {kpr:data.kpr||{}};
  m["meta/rutinitas"]  = {recurring:data.plan.recurring||[]};
  m["meta/bakide"]     = {backlog:data.plan.backlog||[]};
  m["meta/pengaturan"] = {work:data.plan.work||{}, categories:data.plan.categories||[],
                          taskCats:data.plan.taskCats||[], trxCats:data.trxCats||[], periode:data.periode||[]};
  m["anggaran/__awal"] = keAnggaran(data.budget.awal||{});
  Object.entries(data.budget.months||{}).forEach(([k,v])=>{ m["anggaran/"+k]=keAnggaran(v); });
  Object.entries(data.plan.weeks||{}).forEach(([k,v])=>{ m["jadwal/"+k]=keMinggu(v); });
  (data.dompet||[]).forEach(t=>{
    m["trx/"+String(t.id)] = {id:t.id, tanggal:t.tanggal||"", keterangan:t.keterangan||"",
                              jumlah:Number(t.jumlah)||0, kategori:t.kategori||"Lainnya"};
  });
  return m;
}

/* Terapkan satu dokumen dari server ke data lokal */
function terapkanMasuk(path,d){
  const i=path.indexOf("/"), kol=path.slice(0,i), id=path.slice(i+1);
  if(kol==="trx"){
    const t={id:(d.id!==undefined?d.id:id), tanggal:d.tanggal||"", keterangan:d.keterangan||"",
             jumlah:Number(d.jumlah)||0, kategori:d.kategori||"Lainnya"};
    const k=data.dompet.findIndex(x=>String(x.id)===String(id));
    if(k>=0) data.dompet[k]=t; else data.dompet.push(t);
    return;
  }
  if(kol==="anggaran"){
    if(id==="__awal") data.budget.awal=dariAnggaran(d);
    else data.budget.months[id]=dariAnggaran(d);
    return;
  }
  if(kol==="jadwal"){ data.plan.weeks[id]=dariMinggu(d); return; }
  if(kol==="meta"){
    if(id==="target")     data.goals = Array.isArray(d.goals)?d.goals:[];
    if(id==="kpr")        data.kpr = d.kpr||data.kpr;
    if(id==="rutinitas")  data.plan.recurring = Array.isArray(d.recurring)?d.recurring:[];
    if(id==="bakide")     data.plan.backlog = Array.isArray(d.backlog)?d.backlog:[];
    if(id==="pengaturan"){
      if(d.work) data.plan.work=d.work;
      if(Array.isArray(d.categories)) data.plan.categories=d.categories;
      if(Array.isArray(d.taskCats))   data.plan.taskCats=d.taskCats;
      if(Array.isArray(d.trxCats)&&d.trxCats.length) data.trxCats=d.trxCats;
      if(Array.isArray(d.periode))    data.periode=d.periode;
    }
  }
}
function terapkanHapus(path){
  const i=path.indexOf("/"), kol=path.slice(0,i), id=path.slice(i+1);
  if(kol==="trx")      data.dompet = data.dompet.filter(x=>String(x.id)!==String(id));
  if(kol==="anggaran" && id!=="__awal") delete data.budget.months[id];
  if(kol==="jadwal")   delete data.plan.weeks[id];
}

/* ---------- kirim perubahan (hanya yang berubah) ---------- */
function refPath(path){
  const i=path.indexOf("/");
  return fb.F.doc(fb.db,"users",fb.uid,path.slice(0,i),path.slice(i+1));
}
/* Bandingkan dua versi dokumen, hasilkan daftar field yang perlu diubah saja */
function bedaField(lama,baru){
  const out=[];
  const telusur=(a,b,jalur)=>{
    const kunci=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
    kunci.forEach(k=>{
      const va=a?a[k]:undefined, vb=b?b[k]:undefined;
      if(kanonik(va)===kanonik(vb)) return;
      const j=jalur.concat(k);
      if(jalur.length===0 && MAP_DALAM.has(k) &&
         va && typeof va==="object" && !Array.isArray(va) &&
         vb && typeof vb==="object" && !Array.isArray(vb)){
        telusur(va,vb,j); return;
      }
      out.push(new fb.F.FieldPath(...j), vb===undefined ? fb.F.deleteField() : vb);
    });
  };
  telusur(lama,baru,[]);
  return out;
}
function tandaiAntre(p){
  antre++; perbaruiStatus();
  p.then(()=>{ antre--; adaGalat=""; perbaruiStatus(); })
   .catch(e=>{ antre--; adaGalat=pesanGalat(e); perbaruiStatus(); });
}
function dorongPerubahan(){
  if(!syncAktif()) return;
  const peta=petaLokal();
  let n=0;
  for(const path in peta){
    const baru=kanonik(peta[path]);
    if(cermin[path]===baru) continue;
    const lama = cermin[path] ? JSON.parse(cermin[path]) : null;
    cermin[path]=baru; n++;
    try{
      if(!lama){ tandaiAntre(fb.F.setDoc(refPath(path), peta[path])); }
      else{
        const args=bedaField(lama,peta[path]);
        if(args.length) tandaiAntre(fb.F.updateDoc(refPath(path),...args).catch(e=>{
          if(e&&e.code==="not-found") return fb.F.setDoc(refPath(path), peta[path]);
          throw e;
        }));
      }
    }catch(e){ adaGalat=pesanGalat(e); }
  }
  for(const path in cermin){
    if(path in peta) continue;
    delete cermin[path]; n++;
    try{ tandaiAntre(fb.F.deleteDoc(refPath(path))); }catch(e){ adaGalat=pesanGalat(e); }
  }
  if(n) simpanCermin();
  perbaruiStatus();
}
function jadwalkanDorong(){
  if(!syncAktif()) return;
  clearTimeout(dorongTimer);
  dorongTimer=setTimeout(dorongPerubahan,700);
}

/* ---------- dengarkan perubahan dari perangkat lain ---------- */
function renderNanti(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(()=>{
    const modalTerbuka=document.getElementById("modal-bg").classList.contains("show");
    if(modalTerbuka){ renderNanti(); return; }   /* jangan ganggu saat sedang mengisi form */
    render();
  },250);
}
function pasangPendengar(){
  const koleksi=["meta","anggaran","jadwal","trx"];
  return Promise.all(koleksi.map(nama=>new Promise(selesai=>{
    let pertama=true;
    const q=fb.F.collection(fb.db,"users",fb.uid,nama);
    const stop=fb.F.onSnapshot(q, snap=>{
      let berubah=false;
      snap.docChanges().forEach(ch=>{
        if(ch.doc.metadata.hasPendingWrites) return;      /* gema tulisan sendiri, abaikan */
        const path=nama+"/"+ch.doc.id;
        if(ch.type==="removed"){
          if(cermin[path]!==undefined){ terapkanHapus(path); delete cermin[path]; berubah=true; }
          return;
        }
        const isi=ch.doc.data(), sisi=kanonik(isi);
        if(cermin[path]===sisi) return;
        if(faseAwal && cermin[path]!==undefined){
          const lokal=petaLokal()[path];
          if(lokal && kanonik(lokal)!==cermin[path]) bentrok.push(namaBagian(path));
        }
        terapkanMasuk(path,isi); cermin[path]=sisi; berubah=true;
      });
      if(berubah){ simpanTanpaTanda(); simpanCermin(); renderNanti(); }
      perbaruiStatus(snap.metadata.fromCache);
      if(pertama){ pertama=false; selesai(stop); }
    }, err=>{
      adaGalat=pesanGalat(err); syncMode="galat"; perbaruiStatus();
      if(pertama){ pertama=false; selesai(null); }
    });
    unsubs.push(stop);
  })));
}
function namaBagian(path){
  const i=path.indexOf("/"), kol=path.slice(0,i), id=path.slice(i+1);
  if(kol==="trx") return "Transaksi dompet";
  if(kol==="anggaran") return "Anggaran "+(id==="__awal"?"(pola awal)":id);
  if(kol==="jadwal") return "Jadwal minggu "+id;
  return {target:"Target",kpr:"KPR",rutinitas:"Rutinitas",bakide:"Bak Ide",pengaturan:"Pengaturan"}[id]||id;
}

/* ---------- status ---------- */
function perbaruiStatus(dariCache){
  if(dariCache!==undefined) syncMode = dariCache ? "offline" : (adaGalat?"galat":"aman");
  else if(syncAktif() && syncMode!=="menyambung") syncMode = adaGalat ? "galat" : (syncMode==="offline"?"offline":"aman");
  const pill=document.getElementById("sync-pill");
  if(pill){
    let teks="", kelas="";
    if(!syncAktif()) teks="";
    else if(syncMode==="menyambung") teks="Menyambung…";
    else if(antre>0) teks = syncMode==="offline" ? `Offline — ${antre} perubahan menunggu` : "Menyimpan…";
    else if(syncMode==="offline") teks="Offline — tersimpan di perangkat";
    else if(syncMode==="galat"){ teks="Gagal sinkron"; kelas="galat"; }
    else { teks="Tersinkron"; kelas="aman"; }
    pill.textContent=teks;
    pill.className="sync-pill "+kelas;
    pill.style.display = teks ? "block" : "none";
    if(kelas==="aman") setTimeout(()=>{ if(pill.className.indexOf("aman")>=0) pill.style.display="none"; },1800);
  }
  const box=document.getElementById("sync-status");
  if(box) box.innerHTML=ringkasanSync();
}
function ringkasanSync(){
  const s=sesi();
  if(!s) return `<div class="small muted">Belum aktif — data hanya tersimpan di perangkat ini.</div>`;
  let st="Menyambung…";
  if(syncAktif()){
    if(syncMode==="galat") st=`Bermasalah — ${esc(adaGalat)}`;
    else if(syncMode==="offline") st= antre>0 ? `Offline — ${antre} perubahan menunggu dikirim` : "Offline — perubahan tersimpan di perangkat";
    else st = antre>0 ? "Menyimpan…" : "Aktif, realtime";
  } else if(adaGalat) st=`Terputus — ${esc(adaGalat)}`;
  return `
    <div class="row"><span class="name">Status</span><span class="val small">${st}</span></div>
    <div class="row"><span class="name">Akun</span><span class="val small">${esc(s.email||'')}</span></div>
    <div class="row"><span class="name">Project Firebase</span><span class="val small">${esc(FB_CFG.projectId)}</span></div>`;
}
function pesanGalat(e){
  const c=(e&&e.code)||"";
  if(c==="auth/wrong-password"||c==="auth/invalid-credential") return "Email atau password salah.";
  if(c==="auth/invalid-email") return "Format email tidak valid.";
  if(c==="auth/user-not-found") return "Akun belum terdaftar di Firebase Console.";
  if(c==="auth/too-many-requests") return "Terlalu sering gagal login, coba lagi beberapa menit lagi.";
  if(c==="auth/operation-not-allowed") return "Metode Email/Password belum diaktifkan di Firebase Console.";
  if(c==="auth/network-request-failed") return "Tidak ada koneksi internet.";
  if(c==="permission-denied") return "Ditolak Firestore — cek security rules dan UID-nya.";
  if(c==="unavailable") return "Server tidak terjangkau, sedang offline.";
  return (e&&e.message)?String(e.message).slice(0,140):"Kesalahan tidak dikenal.";
}

/* ---------- sambungan ---------- */
async function muatFirebase(){
  const [A,U,F]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`),
  ]);
  const app=A.initializeApp(FB_CFG,"myjourney");
  let db;
  try{
    db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
  }catch(e){ db=F.getFirestore(app); }
  return {A,U,F,app,auth:U.getAuth(app),db,uid:null,email:""};
}

function isiLokalBerarti(){
  const adaMinggu=Object.values(data.plan.weeks||{}).some(w=>(w.tasks&&w.tasks.length)||(w.goals&&w.goals.length));
  const adaAnggaran=Object.values(data.budget.months||{}).some(b=>!b.warisan);
  return (data.dompet||[]).length>0 || adaMinggu || adaAnggaran || (data.plan.backlog||[]).length>0;
}

async function mulaiSinkron(uidLogin,email,pertamaKali){
  fb.uid=uidLogin; fb.email=email;
  cermin = pertamaKali ? {} : bacaCermin();
  cadangkanLokal();
  faseAwal=true; bentrok=[]; syncMode="menyambung"; perbaruiStatus();
  await pasangPendengar();
  faseAwal=false;
  simpanTanpaTanda();
  dorongPerubahan();
  syncMode="aman"; perbaruiStatus();
  render();
  if(bentrok.length){
    const daftar=[...new Set(bentrok)].slice(0,8).join("<br>");
    setTimeout(()=>konfirmasi({judul:'Ada perubahan dari perangkat lain',aman:true,ya:'Mengerti',
      pesan:`Bagian berikut diperbarui dari perangkat lain, jadi versi di perangkat ini digantikan:<br><br>${daftar}<br><br>Salinan pengaman sudah dibuat lebih dulu — bisa dipulihkan dari kartu di menu Data kalau ternyata versi di sini yang benar.`},()=>{}),400);
  }
}

async function syncMasuk(){
  const email=(document.getElementById("fb-email").value||"").trim();
  const pass=document.getElementById("fb-pass").value||"";
  if(!email||!pass){ alert("Email dan password belum diisi."); return; }
  const lanjut=async()=>{
    syncMode="menyambung"; perbaruiStatus();
    try{
      if(!fb) fb=await muatFirebase();
      const cred=await fb.U.signInWithEmailAndPassword(fb.auth,email,pass);
      localStorage.setItem(SESI_KEY,JSON.stringify({email}));
      await mulaiSinkron(cred.user.uid,email,true);
    }catch(e){
      adaGalat=pesanGalat(e); syncMode="galat"; perbaruiStatus();
      alert("Gagal menghubungkan: "+adaGalat);
      render();
    }
  };
  if(isiLokalBerarti()){
    konfirmasi({judul:'Gabungkan dengan data di server?',aman:true,ya:'Gabungkan',
      pesan:'Perangkat ini sudah punya isi. Setelah tersambung, isi server dan isi perangkat ini digabung — untuk bagian yang sama-sama ada, versi server yang dipakai.<br><br>Salinan pengaman dibuat otomatis sebelum penggabungan.'},lanjut);
  } else lanjut();
}

async function syncSambungUlang(){
  const s=sesi();
  if(!s) return;
  try{
    fb=await muatFirebase();
    const u=await new Promise(res=>{
      const stop=fb.U.onAuthStateChanged(fb.auth,x=>{ stop(); res(x); });
      setTimeout(()=>res(null),8000);
    });
    if(!u){ adaGalat="Sesi berakhir, perlu login ulang."; syncMode="galat"; perbaruiStatus(); render(); return; }
    await mulaiSinkron(u.uid,u.email||s.email,false);
  }catch(e){
    adaGalat=pesanGalat(e); syncMode="galat"; perbaruiStatus(); render();
  }
}

function syncKeluar(){
  konfirmasi({judul:'Putuskan sinkron di perangkat ini?',ya:'Putuskan',
    pesan:'Data di perangkat ini tetap ada, begitu juga salinan di server. Anda hanya perlu login lagi untuk menyambungkannya kembali.'},
    async()=>{
      unsubs.forEach(f=>{ try{ f&&f(); }catch(e){} }); unsubs=[];
      try{ if(fb&&fb.auth) await fb.U.signOut(fb.auth); }catch(e){}
      fb=null; antre=0; adaGalat=""; syncMode="mati";
      localStorage.removeItem(SESI_KEY); localStorage.removeItem(SNAP_KEY); cermin={};
      perbaruiStatus(); render();
    });
}

function syncSekarang(){
  if(!syncAktif()){ alert("Sinkron belum aktif."); return; }
  dorongPerubahan();
  alert("Perubahan lokal dikirim. Data dari perangkat lain masuk sendiri secara realtime, tidak perlu ditarik manual.");
}

  if(sesi()) return `
    <div class="card">

        <button class="btn btn-accent btn-sm" onclick="syncSekarang()">Kirim sekarang</button>
        <button class="btn btn-line btn-sm" onclick="syncKeluar()">Putuskan</button>
      </div>
      <div class="small muted section-gap">
        Perubahan dari perangkat lain masuk sendiri dalam hitungan detik. Saat tidak ada sinyal, perubahan
        diantre di perangkat ini dan terkirim otomatis begitu online — asal ikon app-nya tidak dihapus.
      </div>
    </div>`;
  return `
    <div class="card">
      <h3>Sinkron Antar Perangkat</h3>
      <div class="small muted" style="margin-bottom:10px">
        Masuk dengan akun Firebase Anda supaya data yang sama muncul di HP, laptop, dan tablet.
      </div>
      <div class="field"><span class="field-label">Email</span>
        <input type="text" id="fb-email" inputmode="email" autocomplete="username" placeholder="email akun Firebase" /></div>
      <div class="field"><span class="field-label">Password</span>
        <input type="password" id="fb-pass" autocomplete="current-password" placeholder="password akun Firebase" /></div>
      <button class="btn btn-accent btn-full" onclick="syncMasuk()">Masuk &amp; sinkronkan</button>

        Akun dibuat di Firebase Console → Authentication → Users. App ini tidak bisa mendaftarkan akun baru.

}

/* ---------- PWA ---------- */
/* Manifest dibuat dari blob, jadi alamat ikon harus absolut —
   alamat relatif akan dicari dari blob, bukan dari halaman. */
function alamatIkon(nama){
  try{ return new URL(nama, location.href).href; }catch(e){ return nama; }
}
const manifest={name:"My Journey",short_name:"My Journey",start_url:".",display:"standalone",
  background_color:"#F6F4EE",theme_color:"#173229",
  icons:[{src:alamatIkon("icon-192.png"),sizes:"192x192",type:"image/png",purpose:"any"},
         {src:alamatIkon("icon-512.png"),sizes:"512x512",type:"image/png",purpose:"any"}]};
document.getElementById("manifest-placeholder").href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
if("serviceWorker" in navigator){
  const sw=`
    const CACHE="my-journey-${APP_VERSION}";
    self.addEventListener("install",e=>self.skipWaiting());
    self.addEventListener("activate",e=>e.waitUntil(
      caches.keys().then(k=>Promise.all(k.filter(n=>n!==CACHE).map(n=>caches.delete(n)))).then(()=>self.clients.claim())
    ));
    self.addEventListener("fetch",e=>{
      if(e.request.method!=="GET") return;
      e.respondWith(
        fetch(e.request).then(r=>{
          const salinan=r.clone();
          caches.open(CACHE).then(c=>c.put(e.request,salinan)).catch(()=>{});
          return r;
        }).catch(()=>caches.match(e.request))
      );
    });`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}

/* Data masuk sendiri lewat pendengar realtime, jadi tidak perlu ditarik manual.
   Yang perlu didorong saat app kembali aktif hanyalah perubahan lokal yang belum terkirim. */
function saatKembaliAktif(){ if(syncAktif()) dorongPerubahan(); }
window.addEventListener("focus",saatKembaliAktif);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) saatKembaliAktif(); });

  },400);
}
