function renderDompet(){
  const list=filteredTrx();
  const total=list.reduce((s,t)=>s+Number(t.jumlah||0),0);
  const chips=["Semua",...trxCatNames()].map(c=>
    `<button class="chip-btn ${dompetFilter.cat===c?'on':''}" onclick="setFilter('cat','${esc(c)}')">${c==="Semua"?"Semua":trxCfg(c).icon+" "+esc(c)}</button>`).join('');

  const periodeAktif = data.periode.find(p=>p.from===dompetFilter.from && p.to===dompetFilter.to);
  const periodeChips = data.periode.length ? data.periode.map(p=>`
      <span class="periode-chip ${periodeAktif&&periodeAktif.id===p.id?'on':''}">
        <button class="periode-apply" onclick="pakaiPeriode('${p.id}')">${esc(p.name)}</button>
        <button class="periode-x" onclick="openPeriodeModal('${p.id}')">✎</button>
        <button class="periode-x" onclick="hapusPeriode('${p.id}')">✕</button>
      </span>`).join('') : `<span class="small muted">Belum ada periode tersimpan.</span>`;

  const bisaSimpan = dompetFilter.from && dompetFilter.to;

  const head=`
    <div class="total-card">
      <div class="label">${periodeAktif?esc(periodeAktif.name):(filterAktif()?'Total (terfilter)':'Total pengeluaran')}</div>
      <div class="amount">${fmt(total)}</div>
      <div class="count">${list.length} transaksi</div>
    </div>
    <div class="subnav">
      <button class="${dompetSub==='transaksi'?'active':''}" onclick="setDompetSub('transaksi')">Transaksi</button>
      <button class="${dompetSub==='rekap'?'active':''}" onclick="setDompetSub('rekap')">Rekap</button>
      <button class="${dompetSub==='kategori'?'active':''}" onclick="setDompetSub('kategori')">Kategori</button>
    </div>`;

  if(dompetSub==="kategori") return head+renderTrxKategori();

  const filterCard=`
    <div class="card">
      <span class="field-label">Periode tersimpan</span>
      <div class="periode-wrap">${periodeChips}</div>
      <span class="field-label section-gap">Rentang tanggal</span>
      <button class="range-btn" onclick="openRentangModal()">
        <span class="range-text">${labelRentang()}</span>
        <span class="range-edit">Ubah</span>
      </button>
      ${bisaSimpan?`<button class="btn btn-line btn-sm btn-full section-gap" onclick="openPeriodeModal(null)">＋ Simpan rentang ini sebagai periode</button>`:''}
      <span class="field-label section-gap">Kategori</span>
      <div class="chips">${chips}</div>
      ${filterAktif()?`<button class="btn btn-ghost btn-sm btn-full section-gap" onclick="resetFilter()">Reset filter</button>`:''}
    </div>`;

  if(dompetSub==="rekap") return head+filterCard+renderRekap(list,total);

  if(!list.length) return head+filterCard+`<div class="card"><div class="empty">${data.dompet.length?'Tidak ada transaksi pada filter ini.':'Belum ada transaksi.'}</div></div>`;

  const byDate={};
  list.forEach(t=>{ (byDate[t.tanggal]=byDate[t.tanggal]||[]).push(t); });
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  const body=dates.map(d=>{
    const dayTotal=byDate[d].reduce((s,t)=>s+Number(t.jumlah||0),0);
    const rows=byDate[d].map(t=>{
      const c=trxCfg(t.kategori);
      return `
        <div class="trx">
          <div class="trx-icon" style="background:${c.bg}">${c.icon}</div>
          <div class="trx-body">
            <div class="trx-desc">${esc(t.keterangan)}</div>
            <div class="trx-sub" style="color:${c.text}">${esc(t.kategori)}</div>
          </div>
          <div class="trx-amt">${fmt(t.jumlah)}</div>
          <div class="task-actions">
            <button class="icon-btn" onclick="openTrxModal('${t.id}')">✎</button>
            <button class="icon-btn" onclick="askHapusTrx('${t.id}')">✕</button>
          </div>
        </div>`;
    }).join('');
    return `<div class="date-head">${fmtDate(d)} · ${fmt(dayTotal)}</div><div class="card" style="margin-bottom:0">${rows}</div>`;
  }).join('');
  return head+filterCard+body;
}

/* --- rentang tanggal --- */
function labelRentang(){
  const f=dompetFilter.from, t=dompetFilter.to;
  const o={day:"numeric",month:"short",year:"numeric"};
  if(!f&&!t) return "Semua tanggal";
  if(f&&!t) return `Sejak ${parseDate(f).toLocaleDateString("id-ID",o)}`;
  if(!f&&t) return `Sampai ${parseDate(t).toLocaleDateString("id-ID",o)}`;
  return `${parseDate(f).toLocaleDateString("id-ID",o)} – ${parseDate(t).toLocaleDateString("id-ID",o)}`;
}
let cal={from:"",to:"",month:""};
function openRentangModal(){
  modalState={type:'rentang'};
  cal={from:dompetFilter.from,to:dompetFilter.to,month:(dompetFilter.from||dateKey(new Date())).slice(0,7)};
  openModal(calHtml());
}
function calRefresh(){ document.getElementById("modal").innerHTML=calHtml(); }
function calShift(n){ cal.month=shiftMonthKey(cal.month,n); calRefresh(); }
function calPick(d){
  if(!cal.from || (cal.from && cal.to)){ cal.from=d; cal.to=""; }
  else if(d<cal.from){ cal.from=d; }
  else { cal.to=d; }
  calRefresh();
}
function calPreset(jenis){
  const n=new Date();
  if(jenis==="bulanIni"){
    cal.from=dateKey(new Date(n.getFullYear(),n.getMonth(),1));
    cal.to=dateKey(new Date(n.getFullYear(),n.getMonth()+1,0));
  }else if(jenis==="bulanLalu"){
    cal.from=dateKey(new Date(n.getFullYear(),n.getMonth()-1,1));
    cal.to=dateKey(new Date(n.getFullYear(),n.getMonth(),0));
  }else if(jenis==="30hari"){
    const a=new Date(n); a.setDate(a.getDate()-29);
    cal.from=dateKey(a); cal.to=dateKey(n);
  }else{ cal.from=""; cal.to=""; }
  if(cal.from) cal.month=cal.from.slice(0,7);
  calRefresh();
}
function calBulanHtml(mk,tampilPanahKiri,tampilPanahKanan){
  const [y,m]=mk.split("-").map(Number);
  const pertama=new Date(y,m-1,1);
  const geser=(pertama.getDay()+6)%7;              // Senin = 0
  const jmlHari=new Date(y,m,0).getDate();
  const hariBulanLalu=new Date(y,m-1,0).getDate();
  const hariIni=dateKey(new Date());
  const dow=["Sn","Sl","Rb","Km","Jm","Sb","Mg"].map(d=>`<div class="cal-dow">${d}</div>`).join("");

  let sel="";
  for(let i=0;i<42;i++){
    let tgl,luar=false;
    if(i<geser){ tgl=new Date(y,m-2,hariBulanLalu-geser+i+1); luar=true; }
    else if(i-geser<jmlHari){ tgl=new Date(y,m-1,i-geser+1); }
    else { tgl=new Date(y,m,i-geser-jmlHari+1); luar=true; }
    const k=dateKey(tgl);
    const isFrom=cal.from&&k===cal.from, isTo=cal.to&&k===cal.to;
    const dalam=cal.from&&cal.to&&k>cal.from&&k<cal.to;
    const kelasSel=[
      dalam?"range":"",
      isFrom&&cal.to?"range range-start":"",
      isTo?"range range-end":"",
      luar?"out":"",
    ].filter(Boolean).join(" ");
    const kelasHari=[
      (isFrom||isTo)?"edge":"",
      k===hariIni?"today":"",
    ].filter(Boolean).join(" ");
    sel+=`<div class="cal-cell ${kelasSel}"><button class="cal-day ${kelasHari}" onclick="calPick('${k}')">${tgl.getDate()}</button></div>`;
  }
  return `
    <div class="cal-month">
      <div class="cal-head">
        ${tampilPanahKiri?`<button class="nav-btn cal-nav" onclick="calShift(-1)">‹</button>`:`<span class="cal-nav-sp"></span>`}
        <div class="cal-title">${fmtMonth(mk)}</div>
        ${tampilPanahKanan?`<button class="nav-btn cal-nav" onclick="calShift(1)">›</button>`:`<span class="cal-nav-sp"></span>`}
      </div>
      <div class="cal-grid">${dow}${sel}</div>
    </div>`;
}
function calHtml(){
  const o={day:"numeric",month:"short",year:"numeric"};
  const teksFrom=cal.from?parseDate(cal.from).toLocaleDateString("id-ID",o):"Tanggal awal";
  const teksTo=cal.to?parseDate(cal.to).toLocaleDateString("id-ID",o):"Tanggal akhir";
  return `
    <h3>Rentang Tanggal</h3>
    <div class="chips" style="margin-bottom:14px">
      <button class="chip-btn" onclick="calPreset('bulanIni')">Bulan ini</button>
      <button class="chip-btn" onclick="calPreset('bulanLalu')">Bulan lalu</button>
      <button class="chip-btn" onclick="calPreset('30hari')">30 hari terakhir</button>
      <button class="chip-btn" onclick="calPreset('semua')">Semua</button>
    </div>
    <div class="cal-wrap">
      ${calBulanHtml(cal.month,true,false)}
      ${calBulanHtml(shiftMonthKey(cal.month,1),false,true)}
    </div>
    <div class="cal-foot">
      <div class="cal-box ${cal.from&&!cal.to?'aktif':''}">${teksFrom}</div>
      <span class="cal-dash">–</span>
      <div class="cal-box">${teksTo}</div>
    </div>
    <div class="small muted" style="text-align:center;margin-bottom:10px">
      ${!cal.from?"Ketuk tanggal awal.":(!cal.to?"Sekarang ketuk tanggal akhir.":"Ketuk tanggal lain untuk mulai memilih ulang.")}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="terapkanRentang()">Terapkan</button>
    </div>`;
}
function terapkanRentang(){
  if(cal.from&&!cal.to){ alert("Tanggal akhir belum dipilih."); return; }
  dompetFilter.from=cal.from; dompetFilter.to=cal.to;
  closeModal(); render();
}

/* --- periode tersimpan --- */
function pakaiPeriode(id){
  const p=data.periode.find(x=>x.id===id); if(!p) return;
  dompetFilter.from=p.from; dompetFilter.to=p.to;
  render();
}
function hapusPeriode(id){
  const p=data.periode.find(x=>x.id===id); if(!p) return;
  konfirmasi({judul:'Hapus periode tersimpan?',
    pesan:`<strong>${esc(p.name)}</strong><br><br>Hanya pintasannya yang hilang. Transaksi di rentang ini tetap aman.`},
    ()=>{ data.periode=data.periode.filter(x=>x.id!==id); save(); render(); });
}
function namaPeriodeOtomatis(from,to){
  const o={day:"numeric",month:"short"};
  return `${parseDate(from).toLocaleDateString("id-ID",o)} – ${parseDate(to).toLocaleDateString("id-ID",o)}`;
}
function openPeriodeModal(id){
  const p = id ? data.periode.find(x=>x.id===id) : null;
  modalState={type:'periode',id};
  const from=p?p.from:dompetFilter.from, to=p?p.to:dompetFilter.to;
  openModal(`
    <h3>${p?'Ubah Periode':'Simpan Periode'}</h3>
    <div class="field"><span class="field-label">Nama periode</span>
      <input type="text" id="p-nama" value="${p?esc(p.name):esc(namaPeriodeOtomatis(from,to))}" placeholder="Contoh: Gajian Agustus" /></div>
    <div class="field-row">
      <div class="field"><span class="field-label">Dari</span><input type="date" id="p-from" value="${from}" /></div>
      <div class="field"><span class="field-label">Sampai</span><input type="date" id="p-to" value="${to}" /></div>
    </div>
    <div class="small muted">Sekali disimpan, cukup ketuk namanya untuk melihat transaksi di rentang itu.</div>
    <div class="modal-actions section-gap">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="simpanPeriode()">Simpan</button>
    </div>`);
}
function simpanPeriode(){
  const name=document.getElementById("p-nama").value.trim();
  const from=document.getElementById("p-from").value;
  const to=document.getElementById("p-to").value;
  if(!from||!to){ alert("Tanggal awal dan akhir harus diisi."); return; }
  if(to<from){ alert("Tanggal akhir tidak boleh lebih awal dari tanggal awal."); return; }
  const nama=name||namaPeriodeOtomatis(from,to);
  if(modalState.id){
    Object.assign(data.periode.find(x=>x.id===modalState.id),{name:nama,from,to});
  }else{
    data.periode.push({id:uid('p'),name:nama,from,to});
  }
  dompetFilter.from=from; dompetFilter.to=to;
  save(); closeModal(); render();
}

/* --- kategori pengeluaran --- */
function renderTrxKategori(){
  const rows=trxCats().map(c=>{
    const dipakai=data.dompet.filter(t=>t.kategori===c.name).length;
    return `
      <div class="trx">
        <div class="trx-icon" style="background:${c.color}1A">${c.icon||"💸"}</div>
        <div class="trx-body">
          <div class="trx-desc">${esc(c.name)}</div>
          <div class="trx-sub">${dipakai} transaksi</div>
        </div>
        <div class="task-actions">
          <button class="icon-btn" onclick="openKatModal('${esc(c.name)}')">✎</button>
          <button class="icon-btn" onclick="hapusKat('${esc(c.name)}')">✕</button>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="card">
      <h3>Kategori Pengeluaran</h3>
      <div class="small muted" style="margin-bottom:6px">Ganti nama kategori otomatis memperbarui semua transaksi lama yang memakainya.</div>
      ${rows}
      <button class="btn btn-accent btn-full section-gap" onclick="openKatModal(null)">+ Tambah kategori</button>
    </div>`;
}
function openKatModal(nama){
  const c = nama ? trxCats().find(x=>x.name===nama) : null;
  modalState={type:'kat',nama};
  openModal(`
    <h3>${c?'Ubah Kategori':'Kategori Baru'}</h3>
    <div class="field"><span class="field-label">Nama</span>
      <input type="text" id="k-nama" value="${c?esc(c.name):''}" placeholder="Contoh: Kos-kosan" /></div>
    <div class="field-row">
      <div class="field" style="max-width:110px"><span class="field-label">Ikon</span>
        <input type="text" id="k-icon" value="${c?esc(c.icon):'💸'}" maxlength="4" style="text-align:center;font-size:19px" /></div>
      <div class="field"><span class="field-label">Warna</span>
        <input type="color" id="k-color" value="${c?c.color:'#616161'}" style="height:38px;padding:3px" /></div>
    </div>
    <div class="small muted">Ikon bisa diisi emoji apa pun dari keyboard HP.</div>
    <div class="modal-actions section-gap">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="simpanKat()">Simpan</button>
    </div>`);
}
function simpanKat(){
  const nama=document.getElementById("k-nama").value.trim();
  const icon=document.getElementById("k-icon").value.trim()||"💸";
  const color=document.getElementById("k-color").value;
  if(!nama){ alert("Nama kategori belum diisi."); return; }
  if(!data.trxCats||!data.trxCats.length) data.trxCats=structuredClone(TRX_CATS_DEFAULT);
  const bentrok=data.trxCats.find(c=>c.name.toLowerCase()===nama.toLowerCase() && c.name!==modalState.nama);
  if(bentrok){ alert("Sudah ada kategori dengan nama itu."); return; }
  if(modalState.nama){
    const c=data.trxCats.find(x=>x.name===modalState.nama);
    const lama=c.name;
    Object.assign(c,{name:nama,icon,color});
    if(lama!==nama){
      data.dompet.forEach(t=>{ if(t.kategori===lama) t.kategori=nama; });
      data.periode.forEach(()=>{});
      if(dompetFilter.cat===lama) dompetFilter.cat=nama;
    }
  }else{
    data.trxCats.push({name:nama,icon,color});
  }
  save(); closeModal(); render();
}
function hapusKat(nama){
  if(!data.trxCats||!data.trxCats.length) data.trxCats=structuredClone(TRX_CATS_DEFAULT);
  if(data.trxCats.length<=1){ alert("Minimal harus ada satu kategori."); return; }
  const dipakai=data.dompet.filter(t=>t.kategori===nama);
  const sisa=data.trxCats.filter(c=>c.name!==nama);
  const tujuan=sisa.find(c=>c.name==="Lainnya")||sisa[0];
  const pesan = dipakai.length
    ? `Hapus kategori "${nama}"? ${dipakai.length} transaksi yang memakainya akan dipindahkan ke "${tujuan.name}" (transaksinya tidak hilang).`
    : `Hapus kategori "${nama}"?`;
  konfirmasi({judul:'Hapus kategori ini?',pesan},()=>{
    dipakai.forEach(t=>t.kategori=tujuan.name);
    data.trxCats=sisa;
    if(dompetFilter.cat===nama) dompetFilter.cat="Semua";
    save(); render();
  });
}

function renderRekap(list,total){
  const rekap=trxCatNames().map(k=>({
    kategori:k,
    total:list.filter(t=>t.kategori===k).reduce((s,t)=>s+Number(t.jumlah||0),0),
    count:list.filter(t=>t.kategori===k).length,
  })).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  if(!rekap.length) return `<div class="card"><div class="empty">Belum ada data untuk direkap.</div></div>`;
  const rows=rekap.map(r=>{
    const c=trxCfg(r.kategori);
    const pct=total?Math.round(r.total/total*100):0;
    return `
      <div class="rekap-item">
        <div class="rekap-top">
          <div class="rekap-name"><span class="cat-dot" style="background:${c.dot}"></span>${c.icon} ${esc(r.kategori)}</div>
          <div class="rekap-amt">${fmt(r.total)}</div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${c.dot}"></div></div>
        <div class="rekap-sub">${pct}% · ${r.count} transaksi</div>
      </div>`;
  }).join('');
  return `<div class="card"><h3>Rekap per Kategori</h3>${rows}</div>`;
}

function openTrxModal(id){
  const t = id ? data.dompet.find(x=>String(x.id)===String(id)) : null;
  modalState={type:'trx',id};
  const opts=trxCatNames().map(c=>`<option ${t&&t.kategori===c?'selected':''}>${esc(c)}</option>`).join('');
  openModal(`
    <h3>${t?'Ubah Pengeluaran':'Tambah Pengeluaran'}</h3>
    <div class="field"><span class="field-label">Tanggal</span>
      <input type="date" id="t-tanggal" value="${t?t.tanggal:dateKey(new Date())}" /></div>
    <div class="field"><span class="field-label">Keterangan</span>
      <input type="text" id="t-ket" value="${t?esc(t.keterangan):''}" placeholder="Contoh: Makan siang, Bensin…" /></div>
    <div class="field" style="margin-bottom:4px"><span class="field-label">Jumlah</span>
      <div class="rp-wrap">
        <span class="rp-prefix">Rp</span>
        <input type="text" id="t-jumlah" class="rp-input num" inputmode="numeric" autocomplete="off"
               value="${t?Number(t.jumlah).toLocaleString('id-ID'):''}" placeholder="0"
               oninput="formatRupiahInput(this)" />
      </div></div>
    <div class="dur-hint" id="t-hint">${t?terbilangSingkat(t.jumlah):'Ketik angkanya saja, titik pemisah muncul otomatis.'}</div>
    <div class="field"><span class="field-label">Kategori</span><select id="t-kat">${opts}</select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="simpanTrx()">Simpan</button>
    </div>`);
}
function formatRupiahInput(el){
  const angka=parseRupiah(el.value);
  el.value = angka ? angka.toLocaleString("id-ID") : "";
  const h=document.getElementById("t-hint");
  if(h) h.textContent = angka ? terbilangSingkat(angka) : "Ketik angkanya saja, titik pemisah muncul otomatis.";
}
function simpanTrx(){
  const tanggal=document.getElementById("t-tanggal").value;
  const keterangan=document.getElementById("t-ket").value.trim();
  const jumlah=parseRupiah(document.getElementById("t-jumlah").value);
  const kategori=document.getElementById("t-kat").value;
  if(!tanggal){ alert("Tanggal belum diisi."); return; }
  if(!keterangan){ alert("Keterangan belum diisi."); return; }
  if(!jumlah||jumlah<=0){ alert("Jumlah harus lebih dari 0."); return; }
  if(modalState.id){
    const t=data.dompet.find(x=>String(x.id)===String(modalState.id));
    Object.assign(t,{tanggal,keterangan,jumlah,kategori});
  }else{
    data.dompet.push({id:Date.now(),tanggal,keterangan,jumlah,kategori});
  }
  data.dompet.sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  save(); closeModal(); render();
}
function askHapusTrx(id){
  const t=data.dompet.find(x=>String(x.id)===String(id));
  if(!t) return;
  konfirmasi({judul:'Hapus transaksi ini?',
    pesan:`<strong>${esc(t.keterangan)}</strong><br>${fmt(t.jumlah)} · ${fmtDate(t.tanggal)}<br><br>Transaksi yang dihapus tidak bisa dikembalikan.`},
    ()=>{ data.dompet=data.dompet.filter(x=>String(x.id)!==String(id)); save(); render(); });
}
function pengeluaranBulan(mk){
  return data.dompet.filter(t=>String(t.tanggal).startsWith(mk)).reduce((s,t)=>s+Number(t.jumlah||0),0);
}
function pengeluaranBulanIni(){ return pengeluaranBulan(monthKeyOf(new Date())); }

    return {waktu:new Date(b.waktu),dariVersi:b.dariVersi,trx:(isi.dompet||[]).length};

}

function unduhCadangan(){
  try{
    const isi=JSON.stringify(data);
    const blob=new Blob([isi],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`my-journey-${dateKey(new Date())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ alert("Gagal membuat berkas. Pakai cara salin manual di bawah."); }
}
function muatBerkasCadangan(ev){
  const f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const box=document.getElementById("import-box");
    if(box) box.value=r.result;
    terapkanImpor(String(r.result));
    ev.target.value="";
  };
  r.onerror=()=>alert("Berkas tidak terbaca.");
  r.readAsText(f);
}
function pulihkanCadanganOtomatis(){
  const b=JSON.parse(localStorage.getItem(BACKUP_KEY)||"null");
  if(!b||!b.isi){ alert("Tidak ada salinan pengaman."); return; }
  konfirmasi({judul:'Pulihkan salinan pengaman?',ya:'Pulihkan',
    pesan:'Seluruh isi app dikembalikan ke kondisi salinan tersebut. Semua perubahan setelah itu akan hilang.'},
    ()=>{
      localStorage.setItem(STORAGE_KEY,b.isi);
      data=load(); save();
      alert("Data dikembalikan ke salinan pengaman.");
      render();
    });
}
function salinEkspor(){
  const box=document.getElementById("export-box");
  box.select(); box.setSelectionRange(0,999999);
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  if(navigator.clipboard){ navigator.clipboard.writeText(box.value).then(()=>{},()=>{}); ok=true; }
  alert(ok?"Data tersalin. Simpan di tempat aman.":"Salin manual: teksnya sudah tersorot, tekan lama lalu pilih Copy.");
}
function jalankanImpor(){
  const raw=document.getElementById("import-box").value.trim();
  if(!raw){ alert("Belum ada teks yang ditempel."); return; }
  terapkanImpor(raw);
}
function terapkanImpor(raw){
  let masuk;
  try{ masuk=JSON.parse(raw); }catch(e){ alert("Teks tidak terbaca. Pastikan tersalin lengkap dari awal { sampai akhir }."); return; }
  if(typeof masuk!=="object"||masuk===null){ alert("Isi cadangan tidak valid."); return; }
  const jml=Array.isArray(masuk.dompet)?masuk.dompet.length:0;
  konfirmasi({judul:'Impor data ini?',aman:true,ya:'Impor',
    pesan:`<strong>${jml} transaksi</strong> akan digabung dengan yang sudah ada — tidak ada yang hilang.<br><br>Anggaran, KPR, target, dan jadwal akan <strong>diganti</strong> oleh isi cadangan.`},
    ()=>lanjutkanImpor(masuk));
}
function lanjutkanImpor(masuk){
  try{ localStorage.setItem(BACKUP_KEY,JSON.stringify({waktu:new Date().toISOString(),dariVersi:APP_VERSION,keVersi:APP_VERSION,isi:JSON.stringify(data)})); }catch(e){}
  if(Array.isArray(masuk.dompet)){
    const ada=new Set(data.dompet.map(t=>String(t.id)));
    masuk.dompet.forEach(t=>{ if(t&&!ada.has(String(t.id))) data.dompet.push(t); });
    data.dompet.sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
  }
  if(masuk.budget) data.budget=masuk.budget;
  if(masuk.kpr) data.kpr=masuk.kpr;
  if(Array.isArray(masuk.cicilan)){ data.cicilan=masuk.cicilan; data.migrasiKpr=true; }
  else migrasiKprKeCicilan(data);
  rapikanSemuaCicilan(data);
  if(Array.isArray(masuk.goals)) data.goals=masuk.goals;
  if(masuk.plan) data.plan=masuk.plan;
  if(Array.isArray(masuk.trxCats)&&masuk.trxCats.length) data.trxCats=masuk.trxCats;
  if(Array.isArray(masuk.periode)) data.periode=masuk.periode;
  save();
  alert("Impor selesai. Kalau hasilnya tidak sesuai, salinan pengaman bisa dipulihkan di kartu paling atas.");
  render();
}

function renderKpr(){
  const mk=monthKeyOf(new Date());
  const list=data.cicilan||[];
  const kartu=list.map(c=>{
    const inf=infoCicilan(c,mk);
    const persen = inf.total ? Math.min(100,Math.max(0,Math.round(((inf.status==="lunas"?inf.total:Math.max(0,inf.ke-1))/inf.total)*100))) : 0;
    let status="";
    if(inf.status==="aktif") status=`Bulan ke-${inf.ke} dari ${inf.total} · sisa ${fmtDurasi(inf.sisa)}`;
    else if(inf.status==="jeda") status=`Tidak ada cicilan bulan ini · lanjut ${fmtMonth(inf.naikMk)}`;
    else if(inf.status==="belum") status=`Mulai ${fmtMonth(inf.awal)}`;
    else if(inf.status==="lunas") status=`Lunas sejak ${fmtMonth(shiftMonthKey(inf.selesaiMk,1))}`;
    else status="Tahapan belum diisi";
    const tahap=(c.tahap||[]).map((t,i)=>{
      const dari=t.dari, smp=t.sampai;
      const kini = inf.status==="aktif" && inf.idx===i;
      return `
        <div class="kpr-tier ${kini?'current':''}">
          <div><div class="tier-label">${esc(t.label||`Tahap ${i+1}`)}${kini?' — sekarang':''}</div>
            <div class="tier-sub">${fmtBlnPendek(dari)} – ${fmtBlnPendek(smp)} · ${fmtDurasi(t.bulan)}</div></div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="tier-amount num">${fmt(t.amount)}</div>
            <button class="btn btn-ghost btn-sm" onclick="openTahapModal('${c.id}',${i})">Ubah</button>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="card">
        <div class="cic-head">
          <div><div class="nama">${esc(c.name)}</div><div class="small muted">${status}</div>
            ${inf.total?`<div class="small muted">Total ${fmtDurasi(inf.total)} · ${fmtMonth(inf.awal)} – ${fmtMonth(inf.akhir)}</div>`:''}</div>
          <button class="btn btn-line btn-sm" onclick="openCicilanModal('${c.id}')">Ubah</button>
        </div>
        <div class="cic-amount num">${inf.status==="aktif"?fmt(inf.amount)+'<span class="small muted" style="font-family:Inter,sans-serif;font-weight:500">/bln</span>':'—'}</div>
        ${inf.total?`<div class="cic-bar"><span style="width:${persen}%"></span></div>`:''}
        ${inf.status==="aktif"&&inf.next?`<div class="small muted">Naik jadi ${fmt(inf.next.amount)} mulai ${fmtMonth(inf.naikMk)} (+${fmtShort(inf.next.amount-inf.amount)})</div>`:''}
        ${inf.status==="aktif"&&!inf.next?`<div class="small muted">Lunas setelah ${fmtMonth(inf.selesaiMk)}</div>`:''}
        <details class="cic-tahap" ${(c.tahap||[]).length>1?'':''}>
          <summary class="small" style="cursor:pointer;padding:6px 0;font-weight:600">Tahapan cicilan (${(c.tahap||[]).length})</summary>
          ${tahap||`<div class="empty">Belum ada tahapan.</div>`}
          <button class="btn btn-ghost btn-full section-gap" onclick="openTahapModal('${c.id}',-1)">+ Tambah tahap</button>
        </details>
      </div>`;
  }).join('');
  return `
    <div class="total-card">
      <div class="label">Total cicilan ${fmtMonth(mk)}</div>
      <div class="amount">${fmt(totalCicilan(mk))}</div>

    </div>

    </div>`;
}
function cariCicilan(id){ return (data.cicilan||[]).find(c=>c.id===id); }
/* Dua kolom bulan + keterangan lama yang dihitung otomatis */
function rentangInput(prefix,dari,sampai){
  return `<div class="field-row">
      <div class="field" style="margin-bottom:4px"><span class="field-label">Dari bulan</span>
        <input type="month" id="${prefix}-dari" value="${dari||''}" oninput="hintRentang('${prefix}')" /></div>
      <div class="field" style="margin-bottom:4px"><span class="field-label">Sampai bulan</span>
        <input type="month" id="${prefix}-sampai" value="${sampai||''}" oninput="hintRentang('${prefix}')" /></div>
    </div>
    <div class="dur-hint" id="${prefix}-lama-hint">${teksRentang(dari,sampai)}</div>`;
}
function teksRentang(dari,sampai){
  const ok=/^\d{4}-\d{2}$/;
  if(!ok.test(dari||"")||!ok.test(sampai||"")) return "Isi bulan awal dan akhir — lamanya dihitung otomatis.";
  const n=selisihBulan(dari,sampai)+1;
  if(n<1) return "Bulan akhir harus sama atau setelah bulan awal.";
  return n>=12 ? `Total ${n} bulan (${fmtDurasi(n)})` : `Total ${n} bulan`;
}
function hintRentang(prefix){
  const h=document.getElementById(prefix+"-lama-hint");
  if(h) h.textContent=teksRentang(document.getElementById(prefix+"-dari").value,document.getElementById(prefix+"-sampai").value);
}
function bacaRentang(prefix){
  const dari=document.getElementById(prefix+"-dari").value, sampai=document.getElementById(prefix+"-sampai").value;
  if(!/^\d{4}-\d{2}$/.test(dari)||!/^\d{4}-\d{2}$/.test(sampai)){ alert("Bulan awal dan akhir belum diisi."); return null; }
  if(sampai<dari){ alert("Bulan akhir harus sama atau setelah bulan awal."); return null; }
  return {dari,sampai};
}

function simpanCicilan(){
  const name=document.getElementById("ci-name").value.trim();
  if(!name){ alert("Nama cicilan belum diisi."); return; }
  if(!Array.isArray(data.cicilan)) data.cicilan=[];
  if(modalState.id){
    const c=cariCicilan(modalState.id); if(!c) return;

               value="${t?Number(t.amount).toLocaleString('id-ID'):''}" placeholder="0" oninput="formatRupiahGoal(this,'kt-hint')" /></div></div>
    <div class="dur-hint" id="kt-hint">${t&&t.amount?terbilangSingkat(t.amount):'&nbsp;'}</div>
    ${t?rentangInput('kt',t.dari,t.sampai):rentangInput('kt',dariBaru,shiftMonthKey(dariBaru,11))}

      ${t?`<button class="btn btn-warn" onclick="hapusTahap('${cid}',${i})">Hapus</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="simpanTahap()">Simpan</button>
    </div>`);
}
function simpanTahap(){
  const c=cariCicilan(modalState.cid); if(!c) return;
  const r=bacaRentang('kt'); if(!r) return;
  const bentrok=(c.tahap||[]).find((t,j)=>j!==modalState.idx && !(r.sampai<t.dari || r.dari>t.sampai));
  if(bentrok){ alert(`Rentang ini bertabrakan dengan tahap ${bentrok.label?'"'+bentrok.label+'" ':''}${fmtMonth(bentrok.dari)} – ${fmtMonth(bentrok.sampai)}. Ubah bulannya supaya tidak tumpang tindih.`); return; }
  const payload={label:document.getElementById("kt-label").value.trim(),dari:r.dari,sampai:r.sampai,amount:parseRupiah(document.getElementById("kt-amount").value)};
  if(!Array.isArray(c.tahap)) c.tahap=[];
  if(modalState.idx>=0) Object.assign(c.tahap[modalState.idx],payload); else c.tahap.push(payload);
  rapikanCicilan(c);
  data.migrasiKpr=true; save(); closeModal(); render();
}
function hapusTahap(cid,i){
  const c=cariCicilan(cid); const t=c&&c.tahap[i]; if(!t) return;
  konfirmasi({judul:'Hapus tahap ini?',pesan:`<strong>${esc(t.label||`Tahap ${i+1}`)}</strong> — ${fmt(t.amount)}/bln`},
    ()=>{ c.tahap.splice(i,1); rapikanCicilan(c); data.migrasiKpr=true; save(); closeModal(); render(); });
}

/* ---------- TARGET ---------- */
function renderGoals(){
  if(!data.goals.length) return `<div class="card"><div class="empty">Belum ada target. Tambahkan yang pertama.</div></div>
    <button class="btn btn-accent btn-full" onclick="openGoalModal(null)">+ Tambah target</button>`;
  const items=data.goals.map((g,i)=>{
    const pct=g.target>0?Math.min(100,Math.round(g.current/g.target*100)):0;
    const s=g.date?sisaWaktu(g.date):null;
    return `
      <div class="milestone ${g.target>0&&g.current>=g.target?'done':''}">
        <div class="milestone-head">
          <span class="milestone-title">${esc(g.name)}</span>
          <span class="milestone-date">${g.date?fmtDate(g.date):'tanpa tanggal'}</span>
        </div>
        ${s?`<div class="small ${s.lewat?'muted':''}" style="margin-top:3px">${s.lewat?'Sudah lewat':'Tinggal '+s.text}</div>`:''}
        ${g.target>0?`
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="small muted">${fmt(g.current)} dari ${fmt(g.target)} · ${pct}% · sisa ${fmtShort(Math.max(0,g.target-g.current))}</div>
        `:`<div class="small muted section-gap">Target biaya belum diisi.</div>`}
        ${g.note?`<div class="small muted" style="margin-top:6px">${esc(g.note)}</div>`:''}
        <div class="goal-actions">
          <button class="btn btn-line btn-sm" onclick="moveGoal(${i},-1)" ${i===0?'disabled style="opacity:.35"':''}>↑</button>
          <button class="btn btn-line btn-sm" onclick="moveGoal(${i},1)" ${i===data.goals.length-1?'disabled style="opacity:.35"':''}>↓</button>
          <button class="btn btn-ghost btn-sm" onclick="openGoalModal('${g.id}')">Ubah</button>
          <button class="btn btn-warn btn-sm" onclick="hapusGoal('${g.id}')">Hapus</button>
        </div>
      </div>`;
  }).join('');
  return `<div class="roadmap">${items}</div>
    <button class="btn btn-accent btn-full" onclick="openGoalModal(null)">+ Tambah target</button>
    <div class="small muted section-gap" style="text-align:center">Pakai ↑ ↓ untuk mengatur urutan prioritas.</div>`;
}
function moveGoal(i,dir){
  const j=i+dir;
  if(j<0||j>=data.goals.length) return;
  [data.goals[i],data.goals[j]]=[data.goals[j],data.goals[i]];
  save(); render();
}
function hapusGoal(id){
  const g=data.goals.find(x=>x.id===id); if(!g) return;
  konfirmasi({judul:'Hapus target ini?',
    pesan:`<strong>${esc(g.name)}</strong>${g.target>0?`<br>Progres tersimpan ${fmt(g.current)} dari ${fmt(g.target)}`:''}<br><br>Catatan dan progresnya ikut terhapus.`},
    ()=>{ data.goals=data.goals.filter(x=>x.id!==id); save(); render(); });
}
function openGoalModal(id){
  const g = id ? data.goals.find(x=>x.id===id) : null;
  modalState={type:'goal',id};
  openModal(`
    <h3>${g?'Ubah Target':'Target Baru'}</h3>
    <div class="field"><span class="field-label">Nama target</span>
      <input type="text" id="g-nama" value="${g?esc(g.name):''}" placeholder="Contoh: DP Haji Plus Ibu" /></div>
    <div class="field" style="margin-bottom:4px"><span class="field-label">Sudah terkumpul</span>
      <div class="rp-wrap"><span class="rp-prefix">Rp</span>
        <input type="text" id="g-current" class="rp-input num" inputmode="numeric"
               value="${g?Number(g.current).toLocaleString('id-ID'):''}" placeholder="0" oninput="formatRupiahGoal(this,'g-hint-c')" /></div></div>
    <div class="dur-hint" id="g-hint-c">${g&&g.current?terbilangSingkat(g.current):'&nbsp;'}</div>
    <div class="field" style="margin-bottom:4px"><span class="field-label">Target biaya</span>
      <div class="rp-wrap"><span class="rp-prefix">Rp</span>
        <input type="text" id="g-target" class="rp-input num" inputmode="numeric"
               value="${g?Number(g.target).toLocaleString('id-ID'):''}" placeholder="0" oninput="formatRupiahGoal(this,'g-hint-t')" /></div></div>
    <div class="dur-hint" id="g-hint-t">${g&&g.target?terbilangSingkat(g.target):'Kosongkan kalau biayanya belum diketahui.'}</div>
    <div class="field"><span class="field-label">Tanggal target</span>
      <input type="date" id="g-date" value="${g?g.date||'':''}" /></div>
    <div class="field"><span class="field-label">Catatan</span>
      <input type="text" id="g-note" value="${g?esc(g.note):''}" placeholder="Opsional" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="simpanGoal()">Simpan</button>
    </div>`);
}
function formatRupiahGoal(el,hintId){
  const v=parseRupiah(el.value);
  el.value = v ? v.toLocaleString("id-ID") : "";
  const h=document.getElementById(hintId);
  if(h) h.textContent = v ? terbilangSingkat(v) : " ";
}
function simpanGoal(){
  const name=document.getElementById("g-nama").value.trim();
  if(!name){ alert("Nama target belum diisi."); return; }
  const payload={
    name,
    current:parseRupiah(document.getElementById("g-current").value),
    target:parseRupiah(document.getElementById("g-target").value),
    date:document.getElementById("g-date").value,
    note:document.getElementById("g-note").value.trim(),
  };
  if(modalState.id){ Object.assign(data.goals.find(x=>x.id===modalState.id),payload); }
  else { data.goals.push({id:uid('g'),...payload}); }
  save(); closeModal(); render();
}

/* ---------- JADWAL ---------- */
function renderJadwal(){
  const sub=`
    <div class="subnav">
      <button class="${subView==='jadwal'?'active':''}" onclick="setSub('jadwal')">Jadwal</button>
      <button class="${subView==='rutin'?'active':''}" onclick="setSub('rutin')">Rutinitas</button>

    </div>`;
  if(subView==='rutin') return sub+renderRutin();
  if(subView==='atur') return sub+renderKalenderCard()+renderTaskKategori()+renderKategori()+renderJamKerja();

  const end=addDays(weekKey,6);

          <button class="icon-btn" onclick="moveWeekGoal('${g.id}',-1)" ${i===0?'disabled':''} aria-label="Naikkan">↑</button>
          <button class="icon-btn" onclick="moveWeekGoal('${g.id}',1)" ${i===w.goals.length-1?'disabled':''} aria-label="Turunkan">↓</button>

          <button class="icon-btn" onclick="removeWeekGoal('${g.id}')" aria-label="Hapus">✕</button>
        </div>
      </div>`).join('')
      +(w.goals.length>1?`<div class="small muted" style="margin-top:6px">Paling atas = paling utama. Atur urutan dengan ↑ ↓.</div>`:'')
      :`<div class="empty">Belum ada target minggu ini.</div>`;

  let days="";

  }

  const backlog=data.plan.backlog.length?data.plan.backlog.map(b=>{
    const c=b.cat?catById(b.cat):null, kt=b.kat?taskCatById(b.kat):null, p=b.prio?PRIORITIES[b.prio]:null;
    return `
      <div class="task">
        <div class="task-body">
          <div class="task-name">${esc(b.name)}</div>
          ${(c||kt||p)?`<div class="task-meta">
            ${p?`<span class="chip" style="background:${p.bg};color:${p.fg}">${esc(b.prio)}</span>`:''}
            ${c?`<span class="chip" style="background:${c.color}1A;color:${c.color}">${esc(c.name)}</span>`:''}
            ${kt?`<span class="chip" style="background:${kt.color};color:#fff">${esc(kt.name)}</span>`:''}
          </div>`:''}
        </div>
        <div class="task-actions">
          <button class="btn btn-line btn-sm" onclick="openBacklogModal('${b.id}')">Ubah</button>

          <button class="icon-btn" onclick="removeBacklog('${b.id}')">✕</button>
        </div>
      </div>`;

  return sub+`
    <div class="weekbar">
      <button class="nav-btn" onclick="shiftWeek(-1)">‹</button>
      <div class="label">${fmtDayShort(weekKey)} – ${fmtDayShort(end)}${isThis?' <span>Minggu ini</span>':' <span>'+parseDate(weekKey).getFullYear()+'</span>'}</div>
      <button class="nav-btn" onclick="shiftWeek(1)">›</button>
    </div>

      <button class="btn btn-line btn-sm" onclick="goToday()">Ke minggu ini</button>
      <button class="btn btn-line btn-sm" onclick="copyWeek(-1)">Salin dari minggu lalu</button>
      <button class="btn btn-line btn-sm" onclick="copyWeek(1)">Salin ke minggu depan</button>

    </div>

      <div class="week-actions section-gap" style="margin-bottom:0">

      ${backlog}
      <div class="week-actions section-gap" style="margin-bottom:0">

function renderDayCard(dateStr,isToday){
  const w=getWeek(weekKey);
  const d=parseDate(dateStr);
  const wd=d.getDay();
  const note=w.dayNotes[dateStr]||{type:"Normal",text:""};
  const isOff=["Cuti","Libur","Sakit"].includes(note.type);
  const isWorkday=data.plan.work.days.includes(wd);
  const list=tasksForDay(weekKey,dateStr);

  const dayStart=d.getTime();
  const acara=kalAcaraHari(dateStr);
  const seharian=acara.filter(e=>e.seharian), mtg=acara.filter(e=>!e.seharian);
  const menitDari=ms=>Math.max(0,Math.min(1440,Math.round((ms-dayStart)/60000)));
  const bentrok=bentrokHari(dateStr);
  const barisTugas=t=>{
    const c=catById(t.cat), p=PRIORITIES[t.prio]||PRIORITIES["Rutin"];
    const kt=taskCatById(t.kat);
    const dur=durMin(t.start,t.end);
    return `
      <div class="task ${t.done?'done':''}">
        <div class="checkbox ${t.done?'checked':''}" onclick="toggleTask('${dateStr}','${t.id}',${t.rec})">${t.done?'✓':''}</div>
        <div class="task-body">
          <div class="task-name">${esc(t.name)}${t.rec?' <span class="rec-mark">↻</span>':''}</div>
          <div class="task-meta">
            <span class="chip" style="background:${p.bg};color:${p.fg}">${t.prio||'Rutin'}</span>
            <span class="chip" style="background:${c.color}1A;color:${c.color}">${esc(c.name)}</span>
            ${kt?`<span class="chip" style="background:${kt.color};color:#fff">${esc(kt.name)}</span>`:''}
            ${t.start&&t.end?`<span class="time-text ${bentrok['t:'+t.id]?'bentrok':''}">${t.start}–${t.end} · ${fmtDur(dur)}</span>`:`<span class="time-text">tanpa jam</span>`}
            ${tandaBentrok(bentrok['t:'+t.id])}
          </div>
        </div>
        <div class="task-actions">
          ${t.rec?`<button class="icon-btn" title="Lewati minggu ini" onclick="skipRec('${dateStr}','${t.id}')">✕</button>`
                 :`<button class="icon-btn" title="Ubah" onclick="openTaskModal('${dateStr}','${t.id}')">✎</button>
                   <button class="icon-btn" onclick="removeTask('${t.id}')">✕</button>`}
        </div>
      </div>`;
  };
  const barisMeeting=m=>{
    const s=kalSumberById(m.sumber)||{nama:"Kalender",warna:"#2F5D50"};
    const w=warnaAman(s.warna), k=mtgKunci(m), st=statusMtg(m), g=bentrok["m:"+m.id];
    const lintas=m.mulai<dayStart || m.selesai>dayStart+86400000;
    const lewat=m.selesai<=Date.now();
    return `
      <div class="task mtg ${lewat&&!st?'lewat':''} ${st==='s'?'done':''} ${st==='x'?'absen':''}" style="--mtg:${w}">
        ${st==='x'
          ? `<div class="checkbox mati" title="Ditandai tidak perlu hadir" aria-disabled="true"></div>`
          : `<div class="checkbox ${st==='s'?'checked':''}" onclick="toggleMtg('${k}')" aria-label="Tandai sudah terlaksana">${st==='s'?'✓':''}</div>`}
        <div class="task-body" onclick="openMtgModal('${k}')">
          <div class="task-name ${m.batal?'batal':''}">${esc(m.judul)}${kalBaru(m)?' <span class="chip chip-baru">Baru</span>':''}</div>
          <div class="task-meta">
            <span class="chip" style="background:${w}1A;color:${w}">${esc(s.nama)}</span>
            ${m.batal?'<span class="chip" style="background:var(--warn-soft);color:var(--warn)">Dibatalkan</span>':''}
            ${st==='x'?'<span class="chip" style="background:var(--line);color:var(--ink-soft)">Tidak hadir</span>':''}
            ${m.bebas?'<span class="chip" style="background:var(--sage);color:var(--ink-soft)">Free</span>':''}
            <span class="time-text ${g?'bentrok':''}">${jamMenit(m.mulai)}–${jamMenit(m.selesai)} · ${lintas?'lintas hari':fmtDur(Math.round((m.selesai-m.mulai)/60000))}</span>
            ${tandaBentrok(g)}
          </div>
        </div>
        <div class="task-actions">${m.link && !lewat && !m.batal && st!=='x'?`<a class="btn btn-accent btn-sm" href="${esc(m.link)}" target="_blank" rel="noopener">Gabung</a>`:''}</div>
      </div>`;
  };
  const urut=[...list.map(t=>({u:toMin(t.start),h:barisTugas(t)})), ...mtg.map(m=>({u:menitDari(m.mulai),h:barisMeeting(m)}))];
  urut.sort((a,b)=>a.u==null&&b.u==null?0 : a.u==null?1 : b.u==null?-1 : a.u-b.u);
  const sehariHtml=seharian.length?`<div class="mtg-sehari">${seharian.map(e=>{
    const w=warnaAman((kalSumberById(e.sumber)||{}).warna);
    return `<span class="chip" style="background:${w}1A;color:${w};cursor:pointer" title="Seharian" onclick="openMtgModal('${mtgKunci(e)}')">${esc(e.judul)}</span>`;
  }).join('')}</div>`:'';
  const tasksHtml=urut.length?urut.map(x=>x.h).join(''):`<div class="empty">Belum ada tugas.</div>`;

  let capHtml="";
  if(isWorkday && !isOff){
    const cap=workCapacity(), used=usedOfficeMin(weekKey,dateStr), mm=menitMeetingKantor(dateStr);
    const pct=cap?Math.min(100,Math.round(used/cap*100)):0;
    const over=used>cap;
    capHtml=`<div class="cap">
      <div class="cap-track"><div class="cap-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      <div class="cap-text">Jam kantor terpakai ${fmtDur(used)||'0 menit'} dari ${fmtDur(cap)}${mm?` · meeting ${fmtDur(mm)}`:''}${over?' — kelebihan':''}</div>
    </div>`;
  }

  const opts=DAY_NOTE_TYPES.map(t=>`<option ${note.type===t?'selected':''}>${t}</option>`).join('');

  return `
    <div class="day-card ${isToday?'today':''} ${isOff?'off':''}">
      <div class="day-head">
        <div><span class="day-name">${DAY_NAMES[wd]}</span><span class="day-date">${fmtDayShort(dateStr)}</span></div>
        <select class="day-note-select" onchange="setDayNote('${dateStr}',this.value)">${opts}</select>
      </div>
      ${isOff?`<div class="badge-off">${note.type}</div>`:''}
      ${sehariHtml}
      ${capHtml}
      ${tasksHtml}
      <button class="btn btn-ghost btn-sm btn-full section-gap" onclick="openTaskModal('${dateStr}',null)">+ Tambah tugas</button>
    </div>`;
}

/* week actions */
function shiftWeek(n){ weekKey=addDays(weekKey,n*7); render(); }
function goToday(){ weekKey=mondayKey(new Date()); render(); }
function setDayNote(dateStr,type){
  const w=getWeek(weekKey);
  w.dayNotes[dateStr]={type,text:(w.dayNotes[dateStr]||{}).text||""};
  save(); render();
}
function copyWeek(dir){
  const src = dir===-1 ? addDays(weekKey,-7) : weekKey;
  const dst = dir===-1 ? weekKey : addDays(weekKey,7);
  const s=getWeek(src), t=getWeek(dst);
  if(!s.tasks.length && !s.goals.length){ alert("Minggu sumber masih kosong, tidak ada yang bisa disalin."); return; }
  if(t.tasks.length){
    konfirmasi({judul:'Minggu tujuan sudah berisi tugas',aman:true,ya:'Tetap salin',
      pesan:`Ada ${t.tasks.length} tugas di minggu tujuan. Salinan akan <strong>ditambahkan</strong>, bukan menimpa.`},
      ()=>lakukanSalinMinggu(src,dst,dir));
    return;
  }
  lakukanSalinMinggu(src,dst,dir);
}
function lakukanSalinMinggu(src,dst,dir){
  const s=getWeek(src), t=getWeek(dst);
  s.tasks.forEach(task=>{
    const offset=Math.round((parseDate(task.date)-parseDate(src))/86400000);
    t.tasks.push({...task,id:uid('t'),date:addDays(dst,offset),done:false});
  });
  s.goals.forEach(g=>t.goals.push({id:uid('wg'),name:g.name,done:false}));
  save();
  if(dir===1) weekKey=dst;
  render();
}

/* weekly goals */
function addWeekGoal(){
  const el=document.getElementById("new-week-goal");
  const v=el.value.trim(); if(!v) return;
  getWeek(weekKey).goals.push({id:uid('wg'),name:v,done:false});
  save(); render();
}
function moveWeekGoal(id,dir){
  const w=getWeek(weekKey); const i=w.goals.findIndex(x=>x.id===id); const j=i+dir;
  if(i<0||j<0||j>=w.goals.length) return;
  [w.goals[i],w.goals[j]]=[w.goals[j],w.goals[i]];
  save(); render();
}
function openWeekGoalModal(id){
  const g=getWeek(weekKey).goals.find(x=>x.id===id); if(!g) return;
  modalState={type:'weekgoal',id};
  openModal(`
    <h3>Ubah Target Mingguan</h3>
    <div class="field"><span class="field-label">Target</span>

function toggleWeekGoal(id){

function removeWeekGoal(id){

  save(); render();
}
function skipRec(dateStr,iid){

    ()=>{ getWeek(weekKey).recSkip[iid]=true; save(); render(); });
}
function removeTask(id){

  konfirmasi({judul:'Hapus tugas ini?',

/* ---------- RUTINITAS ---------- */
function renderRutin(){
  const rows=data.plan.recurring.length?data.plan.recurring.map(r=>{
    const c=catById(r.cat), p=PRIORITIES[r.prio]||PRIORITIES["Rutin"];
    const kt=taskCatById(r.kat);
    const dayTxt=(r.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DAY_SHORT[d]).join(", ");
    const st=statusRule(r);
    return `
      <div class="task ${st&&!st.aktif?'nonaktif':''}">
        <div class="task-body">
          <div class="task-name">${esc(r.name)} ${st?`<span class="rule-status ${st.kelas}">${st.teks}</span>`:''}</div>
          <div class="task-meta">
            <span class="chip" style="background:${p.bg};color:${p.fg}">${r.prio}</span>
            <span class="chip" style="background:${c.color}1A;color:${c.color}">${esc(c.name)}</span>
            ${kt?`<span class="chip" style="background:${kt.color};color:#fff">${esc(kt.name)}</span>`:''}
            <span class="time-text">${r.start&&r.end?r.start+'–'+r.end+' · ':''}${dayTxt} · ${freqText(r)}</span>
          </div>
        </div>
        <div class="task-actions">
          ${st&&st.dijeda
            ? `<button class="btn btn-line btn-sm" onclick="lanjutkanRule('${r.id}')">Lanjutkan</button>`
            : (!st||st.aktif ? `<button class="btn btn-line btn-sm" onclick="jedaRule('${r.id}')">Jeda</button>` : '')}
          <button class="icon-btn" onclick="openRuleModal('${r.id}')">✎</button>
          <button class="icon-btn" onclick="removeRule('${r.id}')">✕</button>
        </div>
      </div>`;
  }).join(''):`<div class="empty">Belum ada rutinitas.</div>`;
  return `
    <div class="card">
      <h3>Tugas Rutin</h3>
      <div class="small muted" style="margin-bottom:8px">Sekali diatur, otomatis muncul sesuai pengulangannya tanpa perlu ditulis ulang. Tandai ↻ di jadwal. Rutinitas yang ditunda bisa dijeda — riwayat minggu yang sudah lewat tetap utuh.</div>
      ${rows}
      <button class="btn btn-accent btn-full section-gap" onclick="openRuleModal(null)">+ Tambah rutinitas</button>
    </div>`;
}
function jedaRule(id){
  const r=data.plan.recurring.find(x=>x.id===id); if(!r) return;
  const hari=dateKey(new Date());
  konfirmasi({judul:'Jeda rutinitas ini?',aman:true,ya:'Jeda mulai hari ini',
    pesan:`<strong>${esc(r.name)}</strong> tidak akan muncul di jadwal mulai hari ini sampai Anda menekan Lanjutkan.<br><br>Minggu yang sudah lewat tidak berubah. Kalau sudah tahu tanggal lanjutnya, atur lewat ✎.`},
    ()=>{ r.jeda=(r.jeda||[]).concat({dari:hari,sampai:""}); save(); render(); });
}
function lanjutkanRule(id){
  const r=data.plan.recurring.find(x=>x.id===id); if(!r) return;
  const hari=dateKey(new Date()), kemarin=addDays(hari,-1);
  r.jeda=(r.jeda||[]).map(j=>{
    if(!(j.dari && hari>=j.dari && (!j.sampai || hari<=j.sampai))) return j;
    return j.dari>kemarin ? null : {...j,sampai:kemarin};   /* jeda yang dimulai hari ini dibatalkan saja */
  }).filter(Boolean);
  save(); render();
}
function removeRule(id){
  const r=data.plan.recurring.find(x=>x.id===id); if(!r) return;
  konfirmasi({judul:'Hapus rutinitas ini?',
    pesan:`<strong>${esc(r.name)}</strong><br><br>Akan hilang dari <strong>semua minggu</strong>, termasuk minggu yang sudah lewat.`},
    ()=>{ data.plan.recurring=data.plan.recurring.filter(x=>x.id!==id); save(); render(); });
}

  }).join(''):`<div class="empty">Belum ada kategori.</div>`;

    <div class="card">
      <h3>Kategori Tugas</h3>

function updateTaskCat(id,f,v){
  const c=taskCatById(id); if(!c) return;
  c[f]=v; save();
}
function tambahTaskCat(){
  if(!data.plan.taskCats) data.plan.taskCats=[];
  data.plan.taskCats.push({id:uid('k'),name:'Kategori baru',color:'#2F5D50'});
  save(); render();
}
function hapusTaskCat(id){
  const c=taskCatById(id); if(!c) return;
  let dipakai=0;
  Object.values(data.plan.weeks).forEach(w=>(w.tasks||[]).forEach(t=>{ if(t.kat===id) dipakai++; }));
  data.plan.recurring.forEach(r=>{ if(r.kat===id) dipakai++; });
  konfirmasi({judul:'Hapus kategori tugas ini?',
    pesan:`<strong>${esc(c.name)}</strong>${dipakai?`<br><br>Dipakai oleh ${dipakai} tugas. Tugasnya tidak terhapus, hanya kategorinya jadi kosong.`:''}`},
    ()=>{
      data.plan.taskCats=taskCats().filter(x=>x.id!==id);
      Object.values(data.plan.weeks).forEach(w=>(w.tasks||[]).forEach(t=>{ if(t.kat===id) t.kat=""; }));
      data.plan.recurring.forEach(r=>{ if(r.kat===id) r.kat=""; });
      save(); render();
    });

function renderKategori(){

function updateCat(i,f,v){ data.plan.categories[i][f]=v; save(); }
function addCat(){ data.plan.categories.push({id:uid('c'),name:'Jenis baru',color:'#6B7A8F'}); save(); render(); }
function removeCat(id){

/* ---------- MODAL ---------- */
let aksiKonfirmasi=null, aksiBatal=null;
function konfirmasi(opsi,aksi){
  aksiKonfirmasi=aksi; aksiBatal=opsi.batal||null;
  openModal(`
    <h3>${esc(opsi.judul||'Yakin?')}</h3>
    <div class="konf-pesan">${opsi.pesan||''}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="batalKonfirmasi()">Batal</button>
      <button class="btn ${opsi.aman?'btn-accent':'btn-danger'}" onclick="jalankanKonfirmasi()">${esc(opsi.ya||'Hapus')}</button>
    </div>`);
}
function batalKonfirmasi(){
  const b=aksiBatal; aksiKonfirmasi=null; aksiBatal=null; closeModal();
  if(typeof b==='function') b();
}
/* Versi konfirmasi() yang bisa di-await; hasilnya true kalau dipilih, false kalau dibatalkan. */
function tanya(opsi){ return new Promise(res=>konfirmasi({...opsi,batal:()=>res(false)},()=>res(true))); }
function jalankanKonfirmasi(){
  const a=aksiKonfirmasi; aksiKonfirmasi=null; aksiBatal=null; closeModal();
  if(typeof a==='function') a();
}
function openModal(html){
  document.getElementById("modal").innerHTML=html;
  document.getElementById("modal-bg").classList.add("show");
}
function closeModal(){ document.getElementById("modal-bg").classList.remove("show"); modalState=null; }

function taskCatOptions(sel){
  return `<option value="">— tanpa kategori —</option>`+
    taskCats().map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
}
function catOptions(sel){ return data.plan.categories.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join(''); }
function prioOptions(sel){ return Object.keys(PRIORITIES).map(p=>`<option ${p===sel?'selected':''}>${p}</option>`).join(''); }

function openTaskModal(dateStr,taskId,prefillName,backlogId){
  const w=getWeek(weekKey);
  const t = taskId ? w.tasks.find(x=>x.id===taskId) : null;
  const bItem = backlogId ? data.plan.backlog.find(x=>x.id===backlogId) : null;
  modalState={type:'task',taskId,backlogId};
  openModal(`
    <h3>${t?'Ubah Tugas':(backlogId?'Jadwalkan Ide':'Tugas Baru')}</h3>
    ${backlogId?`<div class="small muted" style="margin-bottom:12px">Setelah disimpan, ide ini pindah dari Bak Ide ke tanggal yang Anda pilih.</div>`:''}
    <div class="field"><span class="field-label">Nama tugas</span>
      <input type="text" id="m-name" value="${esc(t?t.name:(bItem?bItem.name:(prefillName||'')))}" placeholder="Contoh: telepon calon tukang" /></div>
    <div class="field-row">
      <div class="field"><span class="field-label">Jenis</span><select id="m-cat">${catOptions(t?t.cat:(bItem&&bItem.cat?bItem.cat:data.plan.categories[0].id))}</select></div>
      <div class="field"><span class="field-label">Prioritas</span><select id="m-prio">${prioOptions(t?t.prio:(bItem&&bItem.prio?bItem.prio:'Medium'))}</select></div>
    </div>
    <div class="field"><span class="field-label">Kategori</span><select id="m-kat">${taskCatOptions(t?t.kat:(bItem?bItem.kat:''))}</select></div>
    <div class="field"><span class="field-label">Tanggal</span><input type="date" id="m-date" value="${t?t.date:dateStr}" /></div>
    <div class="field-row">
      <div class="field"><span class="field-label">Mulai</span><input type="time" id="m-start" value="${t?t.start||'':''}" oninput="updateDurHint()" /></div>
      <div class="field"><span class="field-label">Selesai</span><input type="time" id="m-end" value="${t?t.end||'':''}" oninput="updateDurHint()" /></div>
    </div>
    <div class="dur-hint" id="m-dur">Durasi otomatis dihitung dari jam mulai & selesai.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-accent" onclick="saveTaskModal()">Simpan</button>
    </div>`);
  updateDurHint();
}
function updateDurHint(){
  const s=document.getElementById("m-start"), e=document.getElementById("m-end"), h=document.getElementById("m-dur");
  if(!s||!e||!h) return;
  const d=durMin(s.value,e.value);
  h.textContent = d ? `Durasi: ${fmtDur(d)}` : "Durasi otomatis dihitung dari jam mulai & selesai.";
}
function saveTaskModal(){
  const name=document.getElementById("m-name").value.trim();
  if(!name){ alert("Nama tugas belum diisi."); return; }
  const date=document.getElementById("m-date").value;
  if(!date){ alert("Tanggal belum diisi."); return; }
  const start=document.getElementById("m-start").value;
  const end=document.getElementById("m-end").value;
  if(start&&end&&toMin(end)<=toMin(start)){ alert("Jam selesai harus lebih besar dari jam mulai."); return; }
  const payload={name,cat:document.getElementById("m-cat").value,kat:document.getElementById("m-kat").value,prio:document.getElementById("m-prio").value,date,start,end};
  const targetWeek=mondayKey(parseDate(date));
  const w=getWeek(targetWeek);
  if(modalState.taskId){
    const cur=getWeek(weekKey);
    const idx=cur.tasks.findIndex(x=>x.id===modalState.taskId);
    const old=cur.tasks[idx];
    cur.tasks.splice(idx,1);
    w.tasks.push({...old,...payload});
  }else{
    w.tasks.push({id:uid('t'),done:false,...payload});
  }
  if(modalState.backlogId) data.plan.backlog=data.plan.backlog.filter(b=>b.id!==modalState.backlogId);
  weekKey=targetWeek;
  save(); closeModal(); render();
}

/* ---------- bentuk data: lokal ⇄ firestore ---------- */
function keAnggaran(b){
  pastikanIncomes(b);
  const pos={}, ord=[], inc={}, incOrd=[];
  (b.items||[]).forEach(it=>{ ord.push(it.id); pos[it.id]={n:it.name||"",a:Number(it.amount)||0}; });
  (b.incomes||[]).forEach(it=>{ incOrd.push(it.id); inc[it.id]={n:it.name||"",a:Number(it.amount)||0}; });
  /* warisan selalu ditulis (true/false): field tingkat atas tidak pernah dihapus saat sinkron */
  return {income:Number(b.income)||0, ord, pos, incOrd, inc, warisan:!!b.warisan};
}
function dariAnggaran(d){
  const ord = Array.isArray(d.ord) ? d.ord : Object.keys(d.pos||{});
  const items = ord.filter(id=>d.pos&&d.pos[id]).map(id=>({id, name:d.pos[id].n||"", amount:Number(d.pos[id].a)||0}));
  const o={income:Number(d.income)||0, items};
  if(d.inc){
    const io = Array.isArray(d.incOrd) ? d.incOrd : Object.keys(d.inc);
    o.incomes = io.filter(id=>d.inc[id]).map(id=>({id, name:d.inc[id].n||"", amount:Number(d.inc[id].a)||0}));
  }
  pastikanIncomes(o);   /* dokumen lama tanpa sumber → jadi satu sumber "Gaji" */
  if(d.warisan) o.warisan=true;
  return o;
}
function keMinggu(w){
  const wg={}, wgOrd=[], tasks={}, tOrd=[];
  (w.goals||[]).forEach(g=>{ const c={...g}; delete c.id; wgOrd.push(g.id); wg[g.id]=c; });
  (w.tasks||[]).forEach(t=>{ const c={...t}; delete c.id; tOrd.push(t.id); tasks[t.id]=c; });
  const o={wg,wgOrd,tasks,tOrd,dayNotes:w.dayNotes||{},recDone:w.recDone||{},recSkip:w.recSkip||{}};
  /* field mtg baru ditulis setelah ada penanda pertama di minggu itu — minggu lain tidak ikut berubah */
  if(w.mtg && typeof w.mtg==="object") o.mtg=w.mtg;
  return o;
}
function dariMinggu(d){
  const wgOrd = Array.isArray(d.wgOrd) ? d.wgOrd : Object.keys(d.wg||{});
  const tOrd  = Array.isArray(d.tOrd)  ? d.tOrd  : Object.keys(d.tasks||{});
  return {
    goals: wgOrd.filter(i=>d.wg&&d.wg[i]).map(i=>({id:i,...d.wg[i]})),
    tasks: tOrd.filter(i=>d.tasks&&d.tasks[i]).map(i=>({id:i,...d.tasks[i]})),
    dayNotes:d.dayNotes||{}, recDone:d.recDone||{}, recSkip:d.recSkip||{},
    ...(d.mtg && typeof d.mtg==="object" ? {mtg:d.mtg} : {})
  };
}

/* Seluruh isi app, dipotong jadi dokumen-dokumen kecil */
function petaLokal(){
  const m={};
  m["meta/target"]     = {goals:data.goals||[]};
  m["meta/kpr"]        = {kpr:data.kpr||{}};
  m["meta/cicilan"]    = {cicilan:data.cicilan||[], migrasiKpr:!!data.migrasiKpr};
  m["meta/rutinitas"]  = {recurring:data.plan.recurring||[]};
  m["meta/bakide"]     = {backlog:data.plan.backlog||[]};
  m["meta/pengaturan"] = {work:data.plan.work||{}, categories:data.plan.categories||[],
                          taskCats:data.plan.taskCats||[], trxCats:data.trxCats||[], periode:data.periode||[]};
  m["anggaran/__awal"] = keAnggaran(data.budget.awal||{});
  Object.entries(data.budget.months||{}).forEach(([k,v])=>{ m["anggaran/"+k]=keAnggaran(v); });
  Object.entries(data.plan.weeks||{}).forEach(([k,v])=>{ m["jadwal/"+k]=keMinggu(v); });
  (data.dompet||[]).forEach(t=>{
    m["trx/"+String(t.id)] = {id:t.id, tanggal:t.tanggal||"", keterangan:t.keterangan||"",
                              jumlah:Number(t.jumlah)||0, kategori:t.kategori||"Lainnya"};
  });
  return m;
}

/* Terapkan satu dokumen dari server ke data lokal */
function terapkanMasuk(path,d){
  const i=path.indexOf("/"), kol=path.slice(0,i), id=path.slice(i+1);
  if(kol==="trx"){
    const t={id:(d.id!==undefined?d.id:id), tanggal:d.tanggal||"", keterangan:d.keterangan||"",
             jumlah:Number(d.jumlah)||0, kategori:d.kategori||"Lainnya"};
    const k=data.dompet.findIndex(x=>String(x.id)===String(id));
    if(k>=0) data.dompet[k]=t; else data.dompet.push(t);
    return;
  }
  if(kol==="anggaran"){
    if(id==="__awal") data.budget.awal=dariAnggaran(d);
    else data.budget.months[id]=dariAnggaran(d);
    return;
  }
  if(kol==="jadwal"){ data.plan.weeks[id]=dariMinggu(d); return; }
  if(kol==="meta"){
    if(id==="target")     data.goals = Array.isArray(d.goals)?d.goals:[];
    if(id==="kpr")        data.kpr = d.kpr||data.kpr;
    if(id==="cicilan"){ data.cicilan = Array.isArray(d.cicilan)?structuredClone(d.cicilan):[]; data.migrasiKpr = !!d.migrasiKpr; }
    if(id==="rutinitas")  data.plan.recurring = Array.isArray(d.recurring)?d.recurring:[];
    if(id==="bakide")     data.plan.backlog = Array.isArray(d.backlog)?d.backlog:[];
    if(id==="pengaturan"){
      if(d.work) data.plan.work=d.work;
      if(Array.isArray(d.categories)) data.plan.categories=d.categories;
      if(Array.isArray(d.taskCats))   data.plan.taskCats=d.taskCats;
      if(Array.isArray(d.trxCats)&&d.trxCats.length) data.trxCats=d.trxCats;
      if(Array.isArray(d.periode))    data.periode=d.periode;
    }
  }
}
function terapkanHapus(path){
  const i=path.indexOf("/"), kol=path.slice(0,i), id=path.slice(i+1);
  if(kol==="trx")      data.dompet = data.dompet.filter(x=>String(x.id)!==String(id));
  if(kol==="anggaran" && id!=="__awal") delete data.budget.months[id];
  if(kol==="jadwal")   delete data.plan.weeks[id];
}

/* ---------- kirim perubahan (hanya yang berubah) ---------- */
function refPath(path){
  const i=path.indexOf("/");
  return fb.F.doc(fb.db,"users",fb.uid,path.slice(0,i),path.slice(i+1));
}
/* Bandingkan dua versi dokumen, hasilkan daftar field yang perlu diubah saja */
function bedaField(lama,baru){
  const out=[];
  const telusur=(a,b,jalur)=>{
    const kunci=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
    kunci.forEach(k=>{
      const va=a?a[k]:undefined, vb=b?b[k]:undefined;
      if(kanonik(va)===kanonik(vb)) return;
      const j=jalur.concat(k);
      if(jalur.length===0 && vb===undefined) return;   /* field dari versi lain — jangan dihapus */
      if(jalur.length===0 && MAP_DALAM.has(k) &&
         va && typeof va==="object" && !Array.isArray(va) &&
         vb && typeof vb==="object" && !Array.isArray(vb)){
        telusur(va,vb,j); return;
      }
      out.push(new fb.F.FieldPath(...j), vb===undefined ? fb.F.deleteField() : vb);
    });
  };
  telusur(lama,baru,[]);
  return out;
}
function tandaiAntre(p){
  antre++; perbaruiStatus();
  p.then(()=>{ antre--; adaGalat=""; perbaruiStatus(); })
   .catch(e=>{ antre--; adaGalat=pesanGalat(e); perbaruiStatus(); });
}
function dorongPerubahan(){
  if(!syncAktif()) return;
  const peta=petaLokal();
  let n=0;
  for(const path in peta){
    const baru=kanonik(peta[path]);
    if(cermin[path]===baru) continue;
    const lama = cermin[path] ? JSON.parse(cermin[path]) : null;
    cermin[path]=baru; n++;
    try{
      if(!lama){ tandaiAntre(fb.F.setDoc(refPath(path), peta[path])); }
      else{
        const args=bedaField(lama,peta[path]);
        if(args.length) tandaiAntre(fb.F.updateDoc(refPath(path),...args).catch(e=>{
          if(e&&e.code==="not-found") return fb.F.setDoc(refPath(path), peta[path]);
          throw e;
        }));
      }
    }catch(e){ adaGalat=pesanGalat(e); }
  }
  for(const path in cermin){
    if(path in peta) continue;
    if(path.startsWith("meta/")) continue;   /* dokumen meta dari versi lain — jangan dihapus */
    delete cermin[path]; n++;
    try{ tandaiAntre(fb.F.deleteDoc(refPath(path))); }catch(e){ adaGalat=pesanGalat(e); }
  }
  if(n) simpanCermin();
  perbaruiStatus();
}
function jadwalkanDorong(){
  if(!syncAktif()) return;
  clearTimeout(dorongTimer);
  dorongTimer=setTimeout(dorongPerubahan,700);
}

/* ---------- dengarkan perubahan dari perangkat lain ---------- */
function renderNanti(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(()=>{
    const modalTerbuka=document.getElementById("modal-bg").classList.contains("show");
    if(modalTerbuka){ renderNanti(); return; }   /* jangan ganggu saat sedang mengisi form */
    render();
  },250);
}
function pasangPendengar(){
  const koleksi=["meta","anggaran","jadwal","trx"];
  return Promise.all(koleksi.map(nama=>new Promise(selesai=>{
    let pertama=true;
    const q=fb.F.collection(fb.db,"users",fb.uid,nama);
    const stop=fb.F.onSnapshot(q, snap=>{
      let berubah=false;
      snap.docChanges().forEach(ch=>{
        if(ch.doc.metadata.hasPendingWrites) return;      /* gema tulisan sendiri, abaikan */
        const path=nama+"/"+ch.doc.id;
        if(ch.type==="removed"){
          if(cermin[path]!==undefined){ terapkanHapus(path); delete cermin[path]; berubah=true; }
          return;
        }
        const isi=ch.doc.data(), sisi=kanonik(isi);
        if(cermin[path]===sisi) return;
        if(faseAwal && cermin[path]!==undefined){
          const lokal=petaLokal()[path];
          if(lokal && kanonik(lokal)!==cermin[path]) bentrok.push(namaBagian(path));
        }
        terapkanMasuk(path,isi); cermin[path]=sisi; berubah=true;
      });
      if(nama==="meta"){
        const m1=migrasiKprKeCicilan(data), m2=rapikanSemuaCicilan(data);   /* data versi 2.3 → dari–sampai */
        if(m1||m2){ berubah=true; if(!faseAwal) jadwalkanDorong(); }
      }
      if(berubah){ simpanTanpaTanda(); simpanCermin(); renderNanti(); }
      perbaruiStatus(snap.metadata.fromCache);
      if(pertama){ pertama=false; selesai(stop); }
    }, err=>{
      adaGalat=pesanGalat(err); syncMode="galat"; perbaruiStatus();
      if(pertama){ pertama=false; selesai(null); }
    });
    unsubs.push(stop);
  })));
}
function namaBagian(path){
  const i=path.indexOf("/"), kol=path.slice(0,i), id=path.slice(i+1);
  if(kol==="trx") return "Transaksi dompet";
  if(kol==="anggaran") return "Anggaran "+(id==="__awal"?"(pola awal)":id);
  if(kol==="jadwal") return "Jadwal minggu "+id;
  return {target:"Target",kpr:"KPR (lama)",cicilan:"Cicilan",rutinitas:"Rutinitas",bakide:"Bak Ide",pengaturan:"Pengaturan"}[id]||id;
}

/* ---------- status ---------- */
function perbaruiStatus(dariCache){
  if(dariCache!==undefined) syncMode = dariCache ? "offline" : (adaGalat?"galat":"aman");
  else if(syncAktif() && syncMode!=="menyambung") syncMode = adaGalat ? "galat" : (syncMode==="offline"?"offline":"aman");
  if(syncAktif() && typeof navigator!=="undefined" && navigator.onLine===false) syncMode="offline";
  renderSyncDot();
  const pill=document.getElementById("sync-pill");
  if(pill) pill.style.display="none";   /* digantikan penanda tetap di bilah menu */
  const box=document.getElementById("sync-status");
  if(box) box.innerHTML=ringkasanSync();
}
/* Penanda tetap di ujung kanan bilah menu, terlihat dari semua halaman */
function renderSyncDot(){
  const el=document.getElementById("sync-dot"); if(!el) return;
  let kelas="", teks="Lokal", judul="Belum masuk akun — data hanya ada di perangkat ini";
  const punyaSesi=!!sesi();
  if(punyaSesi && !syncAktif()){
    if(syncMode==="galat"){ kelas="off"; teks="Terputus"; judul=adaGalat||"Sinkron terputus"; }
    else { kelas="wait"; teks="Menyambung"; judul="Sedang menyambung ke server"; }
  } else if(syncAktif()){
    if(syncMode==="menyambung"){ kelas="wait"; teks="Menyambung"; judul="Sedang menyambung ke server"; }
    else if(syncMode==="galat"){ kelas="off"; teks="Terputus"; judul=adaGalat||"Sinkron gagal"; }
    else if(syncMode==="offline"){ kelas="wait"; teks= antre>0 ? `Offline · ${antre}` : "Offline";
      judul = antre>0 ? `${antre} perubahan menunggu dikirim saat online` : "Offline — perubahan disimpan di perangkat"; }
    else if(antre>0){ kelas="wait"; teks="Menyimpan"; judul="Mengirim perubahan ke server"; }
    else { kelas="on"; teks="Sinkron"; judul="Tersambung, realtime"; }
  }
  el.className="sync-dot "+kelas;
  el.title=judul; el.setAttribute("aria-label","Status sinkron: "+judul);
  el.querySelector("span").textContent=teks;
}
function ringkasanSync(){
  const s=sesi();
  if(!s) return `<div class="small muted">Belum aktif — data hanya tersimpan di perangkat ini.</div>`;
  let st="Menyambung…";
  if(syncAktif()){
    if(syncMode==="galat") st=`Bermasalah — ${esc(adaGalat)}`;
    else if(syncMode==="offline") st= antre>0 ? `Offline — ${antre} perubahan menunggu dikirim` : "Offline — perubahan tersimpan di perangkat";
    else st = antre>0 ? "Menyimpan…" : "Aktif, realtime";
  } else if(adaGalat) st=`Terputus — ${esc(adaGalat)}`;
  return `
    <div class="row"><span class="name">Status</span><span class="val small">${st}</span></div>
    <div class="row"><span class="name">Akun</span><span class="val small">${esc(s.email||'')}</span></div>
    <div class="row"><span class="name">Project Firebase</span><span class="val small">${esc(FB_CFG.projectId)}</span></div>`;
}
function pesanGalat(e){
  const c=(e&&e.code)||"";
  if(c==="auth/wrong-password"||c==="auth/invalid-credential") return "Email atau password salah.";
  if(c==="auth/invalid-email") return "Format email tidak valid.";
  if(c==="auth/user-not-found") return "Akun belum terdaftar di Firebase Console.";
  if(c==="auth/too-many-requests") return "Terlalu sering gagal login, coba lagi beberapa menit lagi.";
  if(c==="auth/operation-not-allowed") return "Metode Email/Password belum diaktifkan di Firebase Console.";
  if(c==="auth/network-request-failed") return "Tidak ada koneksi internet.";
  if(c==="permission-denied") return "Ditolak Firestore — cek security rules dan UID-nya.";
  if(c==="unavailable") return "Server tidak terjangkau, sedang offline.";
  return (e&&e.message)?String(e.message).slice(0,140):"Kesalahan tidak dikenal.";
}

/* ---------- sambungan ---------- */
async function muatFirebase(){
  const [A,U,F]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`),
  ]);
  const app=A.initializeApp(FB_CFG,"myjourney");
  let db;
  try{
    db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
  }catch(e){ db=F.getFirestore(app); }
  return {A,U,F,app,auth:U.getAuth(app),db,uid:null,email:""};
}

function isiLokalBerarti(){
  const adaMinggu=Object.values(data.plan.weeks||{}).some(w=>(w.tasks&&w.tasks.length)||(w.goals&&w.goals.length));
  const adaAnggaran=Object.values(data.budget.months||{}).some(b=>!b.warisan);
  return (data.dompet||[]).length>0 || adaMinggu || adaAnggaran || (data.plan.backlog||[]).length>0;
}

async function mulaiSinkron(uidLogin,email,pertamaKali){
  fb.uid=uidLogin; fb.email=email;
  cermin = pertamaKali ? {} : bacaCermin();
  cadangkanLokal();
  faseAwal=true; bentrok=[]; syncMode="menyambung"; perbaruiStatus();
  await pasangPendengar();
  faseAwal=false;
  pasangPendengarKalender();
  simpanTanpaTanda();
  dorongPerubahan();
  syncMode="aman"; perbaruiStatus();
  render();
  if(bentrok.length){
    const daftar=[...new Set(bentrok)].slice(0,8).join("<br>");
    setTimeout(()=>konfirmasi({judul:'Ada perubahan dari perangkat lain',aman:true,ya:'Mengerti',
      pesan:`Bagian berikut diperbarui dari perangkat lain, jadi versi di perangkat ini digantikan:<br><br>${daftar}<br><br>Salinan pengaman sudah dibuat lebih dulu — bisa dipulihkan dari kartu di menu Data kalau ternyata versi di sini yang benar.`},()=>{}),400);
  }
}

async function syncMasuk(){
  const email=(document.getElementById("fb-email").value||"").trim();
  const pass=document.getElementById("fb-pass").value||"";
  if(!email||!pass){ alert("Email dan password belum diisi."); return; }
  syncMode="menyambung"; perbaruiStatus();
  let cred;
  try{
    if(!fb) fb=await muatFirebase();
    cred=await fb.U.signInWithEmailAndPassword(fb.auth,email,pass);
  }catch(e){
    adaGalat=pesanGalat(e); syncMode="galat"; perbaruiStatus();
    alert("Gagal masuk: "+adaGalat); render(); return;
  }
  const uidBaru=cred.user.uid;
  const pemilik=localStorage.getItem(PEMILIK_KEY);
  try{
    if(pemilik && pemilik!==uidBaru){
      /* Akun lain yang masuk di perangkat ini — jangan pernah digabung. */
      bersihkanLokal();
    } else if(!pemilik && isiLokalBerarti()){
      /* Isi lokal belum pernah punya pemilik (misalnya hasil impor cadangan).
         Baru di sini penggabungan masuk akal, dan hanya setelah tahu akunnya. */
      const setuju=await tanya({judul:'Gabungkan isi perangkat ini?',aman:true,ya:'Gabungkan',
        pesan:`Perangkat ini sudah punya isi yang belum terhubung ke akun mana pun. Isi itu akan digabung ke akun <strong>${esc(email)}</strong> — untuk bagian yang sama-sama ada, versi server yang dipakai.<br><br>Pilih Batal kalau isi ini bukan milik akun tersebut.`});
      if(!setuju){
        try{ await fb.U.signOut(fb.auth); }catch(e){}
        syncMode="mati"; perbaruiStatus(); render(); return;
      }
    }
    localStorage.setItem(PEMILIK_KEY,uidBaru);
    localStorage.setItem(SESI_KEY,JSON.stringify({email}));
    await mulaiSinkron(uidBaru,email,true);
  }catch(e){
    adaGalat=pesanGalat(e); syncMode="galat"; perbaruiStatus();
    alert("Gagal menghubungkan: "+adaGalat); render();
  }
}

async function syncSambungUlang(){
  const s=sesi();
  if(!s) return;
  try{
    fb=await muatFirebase();
    const u=await new Promise(res=>{
      const stop=fb.U.onAuthStateChanged(fb.auth,x=>{ stop(); res(x); });
      setTimeout(()=>res(null),8000);
    });
    if(!u){ adaGalat="Sesi berakhir, perlu login ulang."; syncMode="galat"; perbaruiStatus(); render(); return; }
    const pemilik=localStorage.getItem(PEMILIK_KEY);
    if(pemilik && pemilik!==u.uid) bersihkanLokal();   /* isi lokal bukan milik akun ini */
    localStorage.setItem(PEMILIK_KEY,u.uid);
    localStorage.setItem(SESI_KEY,JSON.stringify({email:u.email||s.email}));
    await mulaiSinkron(u.uid,u.email||s.email,false);
  }catch(e){
    adaGalat=pesanGalat(e); syncMode="galat"; perbaruiStatus(); render();
  }
}

function syncKeluar(){
  const belumTerkirim = antre>0;
  konfirmasi({judul:'Keluar dari akun ini?',ya:'Keluar & kosongkan',
    pesan: (belumTerkirim
      ? `<strong>Masih ada ${antre} perubahan yang belum terkirim ke server.</strong> Kalau keluar sekarang, perubahan itu hilang. Sambungkan ke internet dulu sampai indikator hijau.<br><br>`
      : '')
      + 'Isi app di perangkat ini akan dikosongkan, termasuk salinan pengamannya, supaya tidak terbaca pengguna berikutnya.<br><br>Data Anda tetap utuh di server dan akan turun lagi saat login berikutnya.'},
    async()=>{
      unsubs.forEach(f=>{ try{ f&&f(); }catch(e){} }); unsubs=[];
      try{ if(fb&&fb.auth) await fb.U.signOut(fb.auth); }catch(e){}
      fb=null; syncMode="mati";
      bersihkanLokal();
      budgetMonth=null; weekKey=mondayKey(new Date()); currentTab="ringkasan"; subView="jadwal";
      perbaruiStatus(); render();
    });
}

function syncSekarang(){
  if(!syncAktif()){ alert("Sinkron belum aktif."); return; }
  dorongPerubahan();
  alert("Perubahan lokal dikirim. Data dari perangkat lain masuk sendiri secara realtime, tidak perlu ditarik manual.");
}

function renderSyncCard(){
  if(sesi()) return `
    <div class="card">
      <h3>Sinkron Antar Perangkat</h3>
      <div id="sync-status">${ringkasanSync()}</div>
      <div class="week-actions section-gap" style="margin-bottom:0">
        <button class="btn btn-accent btn-sm" onclick="syncSekarang()">Kirim sekarang</button>
        <button class="btn btn-line btn-sm" onclick="syncKeluar()">Keluar</button>
      </div>
      <div class="small muted section-gap">
        Perubahan dari perangkat lain masuk sendiri dalam hitungan detik. Saat tidak ada sinyal, perubahan
        diantre di perangkat ini dan terkirim otomatis begitu online — asal ikon app-nya tidak dihapus.
        Keluar akan mengosongkan isi app di perangkat ini; datanya tetap aman di server.
      </div>
    </div>`;
  return `
    <div class="card">
      <h3>Sinkron Antar Perangkat</h3>
      <div class="small muted" style="margin-bottom:10px">
        Masuk dengan akun Firebase Anda supaya data yang sama muncul di HP, laptop, dan tablet.
      </div>
      <div class="field"><span class="field-label">Email</span>
        <input type="text" id="fb-email" inputmode="email" autocomplete="username" placeholder="email akun Firebase" /></div>
      <div class="field"><span class="field-label">Password</span>
        <input type="password" id="fb-pass" autocomplete="current-password" placeholder="password akun Firebase" /></div>
      <button class="btn btn-accent btn-full" onclick="syncMasuk()">Masuk &amp; sinkronkan</button>
      <div class="small muted section-gap">
        Akun dibuat di Firebase Console → Authentication → Users. App ini tidak bisa mendaftarkan akun baru.
      </div>
    </div>`;
}

/* ---------- PWA ---------- */
/* Manifest dibuat dari blob, jadi alamat ikon harus absolut —
   alamat relatif akan dicari dari blob, bukan dari halaman. */
function alamatIkon(nama){
  try{ return new URL(nama, location.href).href; }catch(e){ return nama; }
}
const manifest={name:"My Journey",short_name:"My Journey",start_url:".",display:"standalone",
  background_color:"#F6F4EE",theme_color:"#173229",
  icons:[{src:alamatIkon("icon-192.png"),sizes:"192x192",type:"image/png",purpose:"any"},
         {src:alamatIkon("icon-512.png"),sizes:"512x512",type:"image/png",purpose:"any"}]};
document.getElementById("manifest-placeholder").href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));
/* Service worker dari berkas sw.js terpisah (versi blob sebelum 3.0 selalu gagal diam-diam).
   Strateginya network-first: update app tetap langsung masuk saat online. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

const jumlahMigrasi = migrasiDompetLama();
render();
syncSambungUlang();
/* Data masuk sendiri lewat pendengar realtime, jadi tidak perlu ditarik manual.
   Yang perlu didorong saat app kembali aktif hanyalah perubahan lokal yang belum terkirim. */
function saatKembaliAktif(){ if(syncAktif()){ dorongPerubahan(); kalSegarkan(false); } }
/* Kalender diambil ulang tiap 10 menit selama app terbuka; hitung mundur di Ringkasan diperbarui tiap menit. */
setInterval(()=>{ if(!document.hidden) kalSegarkan(false); }, KAL_INTERVAL);
setInterval(()=>{
  if(document.hidden || currentTab!=="ringkasan") return;
  if(document.getElementById("modal-bg").classList.contains("show")) return;
  render();
}, 60000);
window.addEventListener("focus",saatKembaliAktif);
window.addEventListener("offline",()=>{ if(syncAktif()){ syncMode="offline"; perbaruiStatus(); } });
window.addEventListener("online",()=>{ if(syncAktif()){ syncMode="aman"; perbaruiStatus(); dorongPerubahan(); } });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) saatKembaliAktif(); });
if(jumlahMigrasi>0){
  setTimeout(()=>{
    alert(`${jumlahMigrasi} transaksi dari Dompet Saya berhasil dipindahkan ke app ini.`);
    setTab("dompet");
  },400);
}
